<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; flex-direction:column; }
        
        /* Üst Bar (Header) */
        header { display:flex; justify-content:space-between; align-items:center; padding:20px 40px; background:#0b132b; border-bottom:1px solid #1c2541; }
        .logo { font-size:24px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; display:flex; align-items:center; gap:10px; }
        .user-info { display:flex; align-items:center; gap:15px; }
        .user-mail { color:#888; font-size:14px; }
        .btn-logout { background:transparent; color:#ff4aa2; border:1px solid #ff4aa2; padding:8px 16px; border-radius:20px; cursor:pointer; font-weight:600; font-size:14px; transition:0.3s; }
        .btn-logout:hover { background:#ff4aa2; color:white; box-shadow:0 0 10px #ff4aa2; }

        /* Sekme Menüsü (Tabs Navigation) */
        .tabs-container { display:flex; justify-content:center; background:#0b132b; border-bottom:1px solid #1c2541; }
        .tab-button { background:transparent; border:none; color:#888; padding:15px 30px; font-size:16px; font-weight:700; cursor:pointer; position:relative; transition:0.3s; }
        .tab-button:hover { color:white; }
        .tab-button.active { color:#24ffff; }
        .tab-button.active::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:3px; background:#24ffff; box-shadow:0 0 10px #24ffff; }

        /* Ana İçerik Alanı */
        main { flex:1; padding:40px; max-width:800px; width:100%; margin:0 auto; }
        .tab-content { display:none; }
        .tab-content.active { display:block; animation:fadeIn 0.5s ease; }

        /* Mevcut Ladesler Sekmesi Stilleri */
        .lades-card { background:#0b132b; border:1px solid #1c2541; border-radius:15px; padding:20px; margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
        .lades-info h3 { font-size:18px; color:white; margin-bottom:5px; }
        .lades-info p { font-size:14px; color:#888; }
        .lades-status { padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; }
        .status-devam { background:rgba(36, 255, 255, 0.1); color:#24ffff; border:1px solid #24ffff; }
        .status-bitti { background:rgba(255, 74, 162, 0.1); color:#ff4aa2; border:1px solid #ff4aa2; }

        /* Yarat Sekmesi Stilleri (Form) */
        .form-group { margin-bottom:20px; }
        .form-group label { display:block; margin-bottom:8px; color:#888; font-size:14px; font-weight:600; }
        .form-group input, .form-group select { width:100%; padding:15px; border-radius:10px; border:1px solid #1c2541; background:#0b132b; color:white; font-size:16px; }
        .btn-create { width:100%; padding:18px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:18px; cursor:pointer; margin-top:10px; box-shadow:0 0 15px #ff4aa2; }

        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>
<body>

    <!-- Üst Navigasyon -->
    <header>
        <div class="logo">⚡ LADES</div>
        <div class="user-info">
            <span class="user-mail" id="current-user">tsulhan@gmail.com</span>
            <button class="btn-logout" onclick="logout()">Çıkış Yap</button>
        </div>
    </header>

    <!-- Flutter Tarzı Sekme Menüsü -->
    <div class="tabs-container">
        <button class="tab-button active" onclick="switchTab('mevcut-ladesler')">Mevcut Ladesler</button>
        <button class="tab-button" onclick="switchTab('lades-yarat')">Lades Yarat</button>
    </div>

    <!-- Ana İçerik -->
    <main>
        <!-- TAB 1: MEVCUT LADESLER -->
        <div id="mevcut-ladesler" class="tab-content active">
            <div class="lades-card">
                <div class="lades-info">
                    <h3>Akşam Yemeği İddiası</h3>
                    <p>Rakip: Ahmet | Başlangıç: 09.06.2026</p>
                </div>
                <span class="lades-status status-devam">Devam Ediyor</span>
            </div>
            
            <div class="lades-card">
                <div class="lades-info">
                    <h3>Konsol Oyunu Ladesi</h3>
                    <p>Rakip: Mehmet | Bitiş: 05.06.2026</p>
                </div>
                <span class="lades-status status-bitti">Sen Kazandın</span>
            </div>
        </div>

        <!-- TAB 2: LADES YARAT -->
        <div id="lades-yarat" class="tab-content">
            <div class="form-group">
                <label>Lades Konusu / İddia Nedir?</label>
                <input type="text" placeholder="Örn: Hafta sonu maçı, akşam yemeği...">
            </div>
            <div class="form-group">
                <label>Rakip Seç (E-posta veya Kullanıcı Adı)</label>
                <input type="text" placeholder="Rakibinizin adresini yazın">
            </div>
            <button class="btn-create" onclick="alert('Lades başarıyla oluşturuldu ve rakibe davet gönderildi!')">LADES BAŞLAT ⚡</button>
        </div>
    </main>

    <script>
        // Flutter tarzı sekme geçiş mantığı
        function switchTab(tabId) {
            // Tüm içerikleri gizle
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            // Tüm butonların aktifliğini kaldır
            document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));
            
            // Seçileni göster ve butonu aktif yap
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function logout() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
