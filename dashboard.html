<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pazar - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; flex-direction:column; }
        
        /* Header & Cüzdan */
        header { display:flex; justify-content:space-between; align-items:center; padding:20px 40px; background:#0b132b; border-bottom:1px solid #1c2541; }
        .logo { font-size:24px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; cursor:pointer; text-decoration:none; }
        .nav-right { display:flex; align-items:center; gap:20px; }
        .token-bag { background:rgba(36, 255, 255, 0.1); border:1px solid #24ffff; padding:10px 20px; border-radius:30px; font-weight:700; color:#24ffff; box-shadow:0 0 10px rgba(36, 255, 255, 0.2); }
        .btn-nav { background:#ff4aa2; color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; font-weight:700; text-decoration:none; font-size:14px; }

        /* Ana İçerik */
        main { flex:1; padding:40px; max-width:900px; width:100%; margin:0 auto; }
        h2 { margin-bottom:30px; font-weight:800; letter-spacing:0.5px; color:#f8fafc; }

        /* Polymarket Tarzı Lades Kartları */
        .market-grid { display:flex; flex-direction:column; gap:20px; }
        .market-card { background:#0b132b; border:1px solid #1c2541; border-radius:20px; padding:25px; display:flex; justify-content:space-between; align-items:center; transition:0.3s; }
        .market-card:hover { border-color:#334155; }
        .market-info h3 { font-size:20px; color:#fff; margin-bottom:8px; font-weight:700; }
        .market-info p { font-size:14px; color:#64748b; }
        
        /* Evet/Hayır Buton Alanı */
        .market-actions { display:flex; gap:12px; }
        .btn-bet { padding:14px 28px; border-radius:12px; border:none; font-weight:700; font-size:16px; cursor:pointer; transition:0.2s; min-width:110px; }
        .btn-yes { background:rgba(34, 197, 94, 0.15); color:#22c55e; border:1px solid #22c55e; }
        .btn-yes:hover { background:#22c55e; color:#000; }
        .btn-no { background:rgba(239, 68, 68, 0.15); color:#ef4444; border:1px solid #ef4444; }
        .btn-no:hover { background:#ef4444; color:#fff; }

        /* Token Yatırma Kutusu (Modal Pop-up) */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3, 8, 20, 0.8); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:999; }
        .modal { background:#0b132b; border:1px solid #1c2541; padding:30px; border-radius:24px; width:100%; max-width:400px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
        .modal h3 { margin-bottom:15px; font-size:22px; }
        .modal p { color:#64748b; font-size:14px; margin-bottom:20px; }
        .modal input { width:100%; padding:15px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:18px; text-align:center; margin-bottom:20px; font-weight:700; }
        .modal-buttons { display:flex; gap:10px; }
        .btn-modal { flex:1; padding:15px; border-radius:12px; border:none; font-weight:700; cursor:pointer; font-size:16px; }
        .btn-confirm { background:#24ffff; color:#030814; }
        .btn-cancel { background:#1e293b; color:#94a3b8; }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="logo">⚡ LADES</a>
        <div class="nav-right">
            <div class="token-bag">💰 <span id="token-balance">1000</span> TOKEN</div>
            <a href="lades_yarat.html" class="btn-nav">+ Yeni Pazar Aç</a>
        </div>
    </header>

    <main>
        <h2>Aktif Tahmin Pazarları</h2>
        
        <div class="market-grid">
            <div class="market-card">
                <div class="market-info">
                    <h3>Bitcoin bu ay 100.000$'ı geçer mi?</h3>
                    <p>Bitiş: 30 Haz 2026 • Hacim: 14,250 Token</p>
                </div>
                <div class="market-actions">
                    <button class="btn-bet btn-yes" onclick="openBetModal('Bitcoin 100k', 'EVET')">EVET</button>
                    <button class="btn-bet btn-no" onclick="openBetModal('Bitcoin 100k', 'HAYIR')">HAYIR</button>
                </div>
            </div>
            
            <div class="market-card">
                <div class="market-info">
                    <h3>Yarın İstanbul'da yağmur yağar mı?</h3>
                    <p>Bitiş: 10 Haz 2026 • Hacim: 3,400 Token</p>
                </div>
                <div class="market-actions">
                    <button class="btn-bet btn-yes" onclick="openBetModal('İstanbul Yağmur', 'EVET')">EVET</button>
                    <button class="btn-bet btn-no" onclick="openBetModal('İstanbul Yağmur', 'HAYIR')">HAYIR</button>
                </div>
            </div>
        </div>
    </main>

    <div id="bet-modal" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-market-title">Pazar Adı</h3>
            <p>Seçiminiz: <span id="modal-bet-choice" style="font-weight:800;"></span></p>
            <input type="number" id="bet-amount" placeholder="Kaç Token Yatıracaksınız?" min="1">
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-modal btn-confirm" onclick="confirmBet()">Yatır ve Kilitle ⚡</button>
            </div>
        </div>
    </div>

    <script src="src/js/app.js"></script>
    <script>
        // Sayfa yüklendiğinde hafızadaki cüzdanı güncelle
        document.addEventListener("DOMContentLoaded", () => {
            if(typeof updateUI === "function") updateUI();
        });
    </script>
</body>
</html>
