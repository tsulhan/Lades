<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; flex-direction:column; }
        
        header { display:flex; justify-content:space-between; align-items:center; padding:20px 40px; background:#0b132b; border-bottom:1px solid #1c2541; }
        .logo { font-size:24px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; text-decoration:none; }
        
        .header-center { display:flex; align-items:center; gap:25px; }
        .token-bag { background:rgba(36, 255, 255, 0.1); border:1px solid #24ffff; padding:10px 20px; border-radius:30px; font-weight:700; color:#24ffff; box-shadow:0 0 10px rgba(36, 255, 255, 0.2); }
        
        .icon-btn { background:transparent; border:none; color:#888; font-size:20px; cursor:pointer; transition:0.3s; padding:8px; border-radius:50px; }
        .icon-btn:hover { color:#24ffff; background:rgba(36, 255, 255, 0.05); }
        .btn-logout { color:#ff4aa2; margin-left:10px; }
        .btn-logout:hover { color:white; background:rgba(255, 74, 162, 0.2); }

        .tabs-container { display:flex; justify-content:center; background:#0b132b; border-bottom:1px solid #1c2541; }
        .tab-button { background:transparent; border:none; color:#888; padding:15px 30px; font-size:16px; font-weight:700; cursor:pointer; position:relative; transition:0.3s; }
        .tab-button:hover { color:white; }
        .tab-button.active { color:#24ffff; }
        .tab-button.active::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:3px; background:#24ffff; box-shadow:0 0 10px #24ffff; }

        /* Ana Ekran Düzeni */
        main { flex:1; padding:40px; max-width:1100px; width:100%; margin:0 auto; }
        .tab-content { display:none; }
        .tab-content.active { display:block; animation:fadeIn 0.4s ease; }

        /* Mevcut Ladesler için Yan Yana Flex Yapısı */
        .content-layout { display:flex; gap:30px; align-items: flex-start; }
        
        /* Sol Kategori Seçim Paneli */
        .sidebar-categories { width:240px; background:#0b132b; border:1px solid #1c2541; border-radius:20px; padding:20px; flex-shrink: 0; }
        .sidebar-categories h4 { font-size:14px; color:#64748b; font-weight:700; text-transform: uppercase; margin-bottom:15px; letter-spacing: 1px; }
        .sidebar-menu { display:flex; flex-direction:column; gap:8px; }
        .sidebar-menu button { width:100%; text-align:left; padding:12px 16px; background:transparent; border:none; color:#94a3b8; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; transition:0.2s; display:flex; align-items:center; gap:10px; }
        .sidebar-menu button:hover { background:rgba(36, 255, 255, 0.05); color:white; }
        .sidebar-menu button.active { background:rgba(36, 255, 255, 0.1); color:#24ffff; border:1px solid rgba(36, 255, 255, 0.2); }

        /* Sağ Lades Listesi */
        .market-grid { flex:1; display:flex; flex-direction:column; gap:20px; width: 100%; }
        
        .market-card { background:#0b132b; border:1px solid #1c2541; border-radius:20px; padding:25px; display:flex; justify-content:space-between; align-items:center; transition:0.3s; }
        .market-card:hover { border-color:#334155; }
        
        .market-info { display: flex; flex-direction: column; gap: 4px; }
        .market-info h3 { font-size:19px; color:#fff; margin-top:4px; margin-bottom:4px; font-weight:700; }
        .market-info p { font-size:14px; color:#64748b; }
        
        .category-badge { display:inline-block; align-self: flex-start; background:rgba(255, 74, 162, 0.1); color:#ff4aa2; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; border:1px solid rgba(255, 74, 162, 0.2); text-transform: uppercase; }

        .market-actions { display:flex; gap:12px; }
        .btn-bet { padding:14px 24px; border-radius:12px; border:none; font-weight:800; font-size:15px; cursor:pointer; transition:0.2s; min-width:140px; text-align:center; }
        .btn-yes { background:rgba(34, 197, 94, 0.1); color:#22c55e; border:1px solid rgba(34, 197, 94, 0.4); }
        .btn-yes:hover { background:#22c55e; color:#000; box-shadow:0 0 15px rgba(34, 197, 94, 0.4); }
        .btn-no { background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid rgba(239, 68, 68, 0.4); }
        .btn-no:hover { background:#ef4444; color:#fff; box-shadow:0 0 15px rgba(239, 68, 68, 0.4); }

        /* Yarat Formu Tasarımı */
        .create-container { background:#0b132b; border:1px solid #1c2541; padding:35px; border-radius:24px; max-width: 850px; margin: 0 auto; }
        .create-container h2 { margin-bottom:10px; font-weight:800; }
        .create-container .subtitle { color:#64748b; margin-bottom:25px; font-size:14px; }
        .form-row { display:flex; gap:20px; margin-bottom:24px; }
        .form-group { flex:1; }
        .form-group label { display:block; margin-bottom:8px; color:#94a3b8; font-size:14px; font-weight:600; }
        .form-group input, .form-group select { width:100%; padding:15px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:16px; }
        .form-group input:focus, .form-group select:focus { border-color:#24ffff; outline:none; }
        
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-submit { width:100%; padding:18px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:18px; cursor:pointer; box-shadow:0 0 15px #ff4aa2; transition:0.3s; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3, 8, 20, 0.8); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:999; }
        .modal { background:#0b132b; border:1px solid #1c2541; padding:30px; border-radius:24px; width:100%; max-width:400px; text-align:center; }
        .modal h3 { margin-bottom:15px; font-size:22px; }
        .modal p { color:#64748b; font-size:14px; margin-bottom:20px; }
        .modal input { width:100%; padding:15px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:18px; text-align:center; margin-bottom:20px; font-weight:700; }
        .modal-buttons { display:flex; gap:10px; }
        .btn-modal { flex:1; padding:15px; border-radius:12px; border:none; font-weight:700; cursor:pointer; font-size:16px; }
        .btn-confirm { background:#24ffff; color:#030814; }
        .btn-cancel { background:#1e293b; color:#94a3b8; }

        @keyframes fadeIn { 
            from { opacity:0; transform:translateY(8px); } 
            to { opacity:1; transform:translateY(0); } 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ LADES</div>
        <div class="header-center">
            <div class="token-bag">💰 <span id="token-balance">10000</span> TOKEN</div>
            
            <button class="icon-btn" onclick="alert('Yönetici Paneline Yetkiniz Yoktur.')" title="Yönetici Paneli">
                <i class="fa-solid fa-user-shield"></i>
            </button>
            <button class="icon-btn" onclick="alert('Profil Sayfası Yakında eklenecek. E-posta: tsulhan@gmail.com')" title="Profilim">
                <i class="fa-solid fa-user"></i>
            </button>
            <button class="icon-btn btn-logout" onclick="logout()" title="Çıkış Yap">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <div class="tabs-container">
        <button class="tab-button active" onclick="switchTab('mevcut-ladesler')">Mevcut Ladesler</button>
        <button class="tab-button" onclick="switchTab('lades-yarat')">Yarat</button>
    </div>

    <main>
        
        <div id="mevcut-ladesler" class="tab-content active">
            <div class="content-layout">
                
                <div class="sidebar-categories">
                    <h4>Kategoriler</h4>
                    <div class="sidebar-menu">
                        <button class="active" onclick="filterCategory('Tümü')"><i class="fa-solid fa-globe"></i> Tümü</button>
                        <button onclick="filterCategory('Spor')"><i class="fa-solid fa-trophy"></i> Spor</button>
                        <button onclick="filterCategory('Ekonomi')"><i class="fa-solid fa-chart-line"></i> Ekonomi</button>
                        <button onclick="filterCategory('Siyaset')"><i class="fa-solid fa-landmark"></i> Siyaset</button>
                        <button onclick="filterCategory('Eğlence')"><i class="fa-solid fa-gamepad"></i> Eğlence</button>
                    </div>
                </div>

                <div class="market-grid" id="market-grid"></div>

            </div> </div> <div id="lades-yarat" class="tab-content">
            <div class="create-container">
                <h2>Yeni Bir Tahmin Pazarı Oluştur</h2>
                <p class="subtitle">Bahsinizi ve yönünüzü belirleyerek canlıya yeni bir iddia pazarı sürün.</p>
                
                <div class="form-row">
                    <div class="form-group" style="flex: 1;">
                        <label>Kategori Seçin</label>
                        <select id="market-category">
                            <option value="Spor">🏆 Spor</option>
                            <option value="Ekonomi">📈 Ekonomi</option>
                            <option value="Siyaset">🏛️ Siyaset</option>
                            <option value="Eğlence">🎮 Eğlence</option>
                        </select>
                    </div>
                    
                    <div class="form-group" style="flex: 2;">
                        <label>Lades Başlığı / Tahmin Sorusu</label>
                        <input type="text" id="market-question" placeholder="Örn: Bu akşam maçı Real Madrid kazanır mı?">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Pazar Kapanış Tarihi</label>
                        <input type="date" id="market-date" onclick="this.showPicker()">
                    </div>
                    
                    <div class="form-group">
                        <label>Sizin Tercihiniz</label>
                        <select id="market-choice">
                            <option value="YES">EVET</option>
                            <option value="NO">HAYIR</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 30px;">
                    <label>Yatırmak İstediğiniz Token Miktarı</label>
                    <input type="number" id="market-initial-bet" placeholder="Örn: 150" min="1">
                </div>
                
                <button class="btn-submit" onclick="createNewMarket()">PAZARI YAYINA AL ⚡</button>
            </div>
        </div>
        
    </main>

    <div id="bet-modal" class="modal-overlay">
        <div class="modal">
            <h3 id="modal-market-title">Pazar Adı</h3>
            <p>Seçiminiz: <span id="modal-bet-choice" style="font-weight:800;"></span></p>
            <input type="number" id="bet-amount" placeholder="Kaç Token Yatıracaksınız?" min="1">
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="closeModal()">İptal</button>
                <button class="btn-modal btn-confirm" onclick="confirmBet()">Yatır ve Kilitle ⚡</button>
            </div>
        </div>
    </div>

    <script src="src/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(typeof updateUI === "function") updateUI();
        });

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function logout() {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
