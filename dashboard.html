<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (!localStorage.getItem('currentUser')) {
            window.location.href = 'login.html';
        }
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; flex-direction:column; }
        
        header { display:flex; justify-content:space-between; align-items:center; padding:20px 40px; background:#0b132b; border-bottom:1px solid #1c2541; }
        .logo { font-size:24px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; text-decoration:none; }
        
        .header-center { display:flex; align-items:center; gap:20px; }
        .user-email-badge { background: rgba(255,255,255,0.05); border: 1px solid #1c2541; padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: 600; color: #94a3b8; }
        .token-bag { background:rgba(36, 255, 255, 0.1); border:1px solid #24ffff; padding:10px 20px; border-radius:30px; font-weight:700; color:#24ffff; }
        
        .icon-btn { background:transparent; border:none; color:#888; font-size:20px; cursor:pointer; transition:0.3s; padding:8px; border-radius:50px; }
        .icon-btn:hover { color:#24ffff; background:rgba(36, 255, 255, 0.05); }
        .btn-logout { color:#ff4aa2; margin-left:10px; }
        .btn-logout:hover { color:white; background:rgba(255, 74, 162, 0.2); }

        .tabs-container { display:flex; justify-content:center; background:#0b132b; border-bottom:1px solid #1c2541; }
        .tab-button { background:transparent; border:none; color:#888; padding:15px 30px; font-size:16px; font-weight:700; cursor:pointer; position:relative; transition:0.3s; }
        .tab-button.active { color:#24ffff; }
        .tab-button.active::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:3px; background:#24ffff; }

        main { flex:1; padding:40px; max-width:1100px; width:100%; margin:0 auto; }
        .tab-content { display:none; }
        .tab-content.active { display:block; }

        .content-layout { display:flex; gap:30px; align-items: flex-start; }
        
        .sidebar-categories { width:240px; background:#0b132b; border:1px solid #1c2541; border-radius:20px; padding:20px; }
        .sidebar-categories h4 { font-size:14px; color:#64748b; font-weight:700; margin-bottom:15px; text-transform: uppercase; }
        .sidebar-menu { display:flex; flex-direction:column; gap:8px; }
        .sidebar-menu button { width:100%; text-align:left; padding:12px 16px; background:transparent; border:none; color:#94a3b8; border-radius:10px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:10px; }
        .sidebar-menu button.active, .sidebar-menu button:hover { background:rgba(36, 255, 255, 0.1); color:#24ffff; }

        .market-grid { flex:1; display:flex; flex-direction:column; gap:20px; }
        .market-card { background:#0b132b; border:1px solid #1c2541; border-radius:20px; padding:25px; display:flex; justify-content:space-between; align-items:center; }
        .market-info { display: flex; flex-direction: column; gap: 4px; }
        .category-badge { display:inline-block; align-self: flex-start; background:rgba(255, 74, 162, 0.1); color:#ff4aa2; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-transform: uppercase; }

        .market-actions { display:flex; gap:12px; }
        .btn-bet { padding:14px 24px; border-radius:12px; border:none; font-weight:800; font-size:15px; cursor:pointer; min-width:140px; }
        .btn-yes { background:rgba(34, 197, 94, 0.1); color:#22c55e; border:1px solid rgba(34, 197, 94, 0.4); }
        .btn-no { background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid rgba(239, 68, 68, 0.4); }

        .create-container { background:#0b132b; border:1px solid #1c2541; padding:35px; border-radius:24px; max-width: 850px; margin: 0 auto; }
        .form-row { display:flex; gap:20px; margin-bottom:24px; }
        .form-group { flex:1; display:flex; flex-direction:column; }
        .form-group label { margin-bottom:8px; color:#94a3b8; font-size:14px; font-weight:600; }
        .form-group input, .form-group select { padding:15px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:16px; }
        
        .btn-submit { width:100%; padding:18px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:18px; cursor:pointer; box-shadow:0 0 15px #ff4aa2; }

        .admin-modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3, 8, 20, 0.9); justify-content:center; align-items:center; z-index:9999; }
        .admin-box { background:#0b132b; border:1px solid #24ffff; padding:30px; border-radius:24px; width:100%; max-width:750px; }
        .admin-section { border-top: 1px solid #1c2541; padding-top:20px; margin-top:20px; }
        .admin-section h4 { color:#24ffff; margin-bottom:12px; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3, 8, 20, 0.8); justify-content:center; align-items:center; z-index:999; }
        .modal { background:#0b132b; border:1px solid #1c2541; padding:30px; border-radius:24px; width:100%; max-width:400px; text-align:center; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ LADES</div>
        <div class="header-center">
            <div id="user-email-badge" class="user-email-badge">yükleniyor...</div>
            <div class="token-bag">💰 <span id="token-balance">0</span> TOKEN</div>
            
            <button id="admin-panel-btn" class="icon-btn" onclick="openAdminPanel()" title="Yönetici Paneli" style="display:none; color:#24ffff;">
                <i class="fa-solid fa-user-shield"></i>
            </button>
            <button class="icon-btn" onclick="alert('Profil Yakında!')" title="Profilim">
                <i class="fa-solid fa-user"></i>
            </button>
            <button class="icon-btn btn-logout" onclick="logout()" title="Çıkış Yap">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <div class="tabs-container">
        <button class="tab-button active" onclick="switchTab('mevcut-ladesler')">Mevcut Ladesler</button>
        <button class="tab-button" onclick="switchTab('lades-yarat')">Yarat</button>
    </div>

    <main>
        <div id="mevcut-ladesler" class="tab-content active">
            <div class="content-layout">
                <div class="sidebar-categories">
                    <h4>Kategoriler</h4>
                    <div class="sidebar-menu">
                        <button class="active" onclick="filterCategory('Tümü')"><i class="fa-solid fa-globe"></i> Tümü</button>
                        <button onclick="filterCategory('Spor')"><i class="fa-solid fa-trophy"></i> Spor</button>
                        <button onclick="filterCategory('Ekonomi')"><i class="fa-solid fa-chart-line"></i> Ekonomi</button>
                        <button onclick="filterCategory('Siyaset')"><i class="fa-solid fa-landmark"></i> Siyaset</button>
                        <button onclick="filterCategory('Eğlence')"><i class="fa-solid fa-gamepad"></i> Eğlence</button>
                    </div>
                </div>
                <div class="market-grid" id="market-grid"></div>
            </div>
        </div>

        <div id="lades-yarat" class="tab-content">
            <div class="create-container">
                <h2 style="margin-bottom:20px;">Yeni Bir Tahmin Pazarı Oluştur</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Kategori Seçin</label>
                        <select id="market-category">
                            <option value="Spor">🏆 Spor</option>
                            <option value="Ekonomi">📈 Ekonomi</option>
                            <option value="Siyaset">🏛️ Siyaset</option>
                            <option value="Eğlence">🎮 Eğlence</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex:2;">
                        <label>Lades Başlığı / Tahmin Sorusu</label>
                        <input type="text" id="market-question" placeholder="Örn: Bu akşam maçı kim kazanır?">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Pazar Kapanış Tarihi</label>
                        <input type="date" id="market-date">
                    </div>
                    <div class="form-group">
                        <label>Sizin Tercihiniz</label>
                        <select id="market-choice">
                            <option value="YES">EVET</option>
                            <option value="NO">HAYIR</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:30px;">
                    <label>Yatırmak İstediğiniz Token Miktarı</label>
                    <input type="number" id="market-initial-bet" placeholder="Miktar giriniz">
                </div>
                
                <button class="btn-submit" onclick="createNewMarket()">PAZARI YAYINA AL ⚡</button>
            </div>
        </div>
    </main>

    <div id="admin-modal" class="admin-modal-overlay">
        <div class="admin-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="color:#24ffff;"><i class="fa-solid fa-user-shield"></i> Lades Yönetim Paneli</h2>
                <button onclick="closeAdminPanel()" style="background:transparent; border:none; color:#888; font-size:24px; cursor:pointer;">&times;</button>
            </div>
            <div class="admin-section" style="border-top:none;">
                <h4>📥 Bekleyen İstekler (Davet & Token)</h4>
                <div id="admin-requests-list"></div>
            </div>
            <div class="admin-section">
                <h4>👥 Kayıtlı Kullanıcılar ve Token Tanımlama</h4>
                <table style="width:100%; border-collapse:collapse; text-align:left;">
                    <thead>
                        <tr style="color:#64748b; font-size:12px; border-bottom:1px solid #1c2541;">
                            <th>Kullanıcı E-posta</th>
                            <th>Mevcut Bakiye</th>
                            <th style="text-align:right;">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="admin-users-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="bet-modal" class="modal-overlay">
        <div class="modal">
            <h3>Bahis Onayı</h3>
            <p style="margin:15px 0; color:#94a3b8;">Bu pazar için bahsiniz kilitlenecektir.</p>
            <button onclick="closeModal()" style="padding:10px 20px; background:#1e293b; color:white; border:none; border-radius:8px; cursor:pointer;">Kapat</button>
        </div>
    </div>

    <script src="src/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { if(typeof updateUI === "function") updateUI(); });
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(button => button.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(event && event.currentTarget) event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
