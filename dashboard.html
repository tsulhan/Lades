<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; flex-direction:column; }
        
        header { display:flex; justify-content:space-between; align-items:center; padding:20px 40px; background:#0b132b; border-bottom:1px solid #1c2541; }
        .logo { font-size:24px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; text-decoration:none; }
        
        .header-center { display:flex; align-items:center; gap:25px; }
        .token-bag { background:rgba(36, 255, 255, 0.1); border:1px solid #24ffff; padding:10px 20px; border-radius:30px; font-weight:700; color:#24ffff; box-shadow:0 0 10px rgba(36, 255, 255, 0.2); }
        
        .icon-btn { background:transparent; border:none; color:#888; font-size:20px; cursor:pointer; transition:0.3s; padding:8px; border-radius:50px; }
        .icon-btn:hover { color:#24ffff; background:rgba(36, 255, 255, 0.05); }
        .btn-logout { color:#ff4aa2; margin-left:10px; }
        .btn-logout:hover { color:white; background:rgba(255, 74, 162, 0.2); }

        .tabs-container { display:flex; justify-content:center; background:#0b132b; border-bottom:1px solid #1c2541; }
        .tab-button { background:transparent; border:none; color:#888; padding:15px 30px; font-size:16px; font-weight:700; cursor:pointer; position:relative; transition:0.3s; }
        .tab-button:hover { color:white; }
        .tab-button.active { color:#24ffff; }
        .tab-button.active::after { content:''; position:absolute; bottom:0; left:0; width:100%; height:3px; background:#24ffff; box-shadow:0 0 10px #24ffff; }

        main { flex:1; padding:40px; max-width:850px; width:100%; margin:0 auto; }
        .tab-content { display:none; }
        .tab-content.active { display:block; animation:fadeIn 0.4s ease; }

        .market-grid { display:flex; flex-direction:column; gap:20px; }
        .market-card { background:#0b132b; border:1px solid #1c2541; border-radius:20px; padding:25px; display:flex; justify-content:space-between; align-items:center; transition:0.3s; }
        .market-card:hover { border-color:#334155; }
        .market-info h3 { font-size:19px; color:#fff; margin-bottom:8px; font-weight:700; }
        .market-info p { font-size:14px; color:#64748b; }
        
        .market-actions { display:flex; gap:12px; }
        .btn-bet { padding:14px 24px; border-radius:12px; border:none; font-weight:800; font-size:15px; cursor:pointer; transition:0.2s; min-width:140px; text-align:center; }
        .btn-yes { background:rgba(34, 197, 94, 0.1); color:#22c55e; border:1px solid rgba(34, 197, 94, 0.4); }
        .btn-yes:hover { background:#22c55e; color:#000; box-shadow:0 0 15px rgba(34, 197, 94, 0.4); }
        .btn-no { background:rgba(239, 68, 68, 0.1); color:#ef4444; border:1px solid rgba(239, 68, 68, 0.4); }
        .btn-no:hover { background:#ef4444; color:#fff; box-shadow:0 0 15px rgba(239, 68, 68, 0.4); }

        .create-container { background:#0b132b; border:1px solid #1c2541; padding:35px; border-radius:24px; }
        .create-container h2 { margin-bottom:10px; font-weight:800; }
        .create-container .subtitle { color:#64748b; margin-bottom:25px; font-size:14px; }
        .form-row { display:flex; gap:20px; margin-bottom:24px; }
        .form-group { flex:1; }
        .form-group label { display:block; margin-bottom:8px; color:#94a3b8; font-size:14px; font-weight:600; }
        .form-group input, .form-group select { width:100%; padding:15px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:16px; }
        .form-group input:focus, .form-group select:focus { border-color:#24ffff; outline:none; }
        
        /* Takvim ikonunun renk şemasını dark moda uydurmak ve imleci el işareti yapmak için */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-submit { width:100%; padding:18px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:18px; cursor:pointer; box-shadow:0 0 15px #ff4aa2; transition:0.3s; }

        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(3, 8, 20, 0.8); backdrop-filter:blur(5px); justify-content:center; align-items:center; z-index:999; }
        .modal { background:#0b132b; border:1px solid #1c2541; padding:30px; border-radius:24px; width:100%; max-width:400px; text-align:center; }
        .modal h3 { margin-bottom:15px; font-size:22px; }
        .modal p { color:#64748b; font-size:14px; margin-bottom:20px; }
        .modal input { width:100%; padding:15px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:18px; text-align:center; margin-bottom:20px; font-weight:700; }
        .modal-buttons { display:flex; gap:10px; }
        .btn-modal { flex:1; padding:15px; border-radius:12px; border:none; font-weight:700; cursor:pointer; font-size:16px; }
        .btn-confirm { background:#24ffff; color:#030814; }
        .btn-cancel { background:#1e293b; color:#94a3b8; }

        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1;
