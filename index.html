<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LADES</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="welcome-screen" class="screen">
        <div class="logo-box">
            <h1>LADES</h1>
            <p>Tahmin et. Meydan oku. <span style="color:#ff007f">Kazan.</span></p>
        </div>
        <button class="btn-neon" onclick="showAuth()">GİRİŞ YAP ></button>
        <p style="margin-top:20px; font-size:12px; color:var(--text-muted)">Arkadaşlarınla tahmin yap, liderlikte yüksel!</p>
    </div>

    <div id="auth-screen" class="screen hidden">
        <h2 id="auth-title">Giriş Yap</h2>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button class="btn-neon" onclick="handleAuth()">GİRİŞ YAP</button>
        <p onclick="toggleMode()" style="cursor:pointer; color:var(--neon-cyan); margin-top:15px;">Hesabın yok mu? Kayıt Ol</p>
    </div>

    <div id="app-screen" class="screen hidden">
        <h1>Ana Sayfa</h1>
        <button onclick="logout()">Çıkış Yap</button>
    </div>

    <script src="src/js/firebase-config.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
