<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        // OTURUM KONTROLÜ: Eğer kullanıcı zaten giriş yapmışsa direkt dashboard'a gönder
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .login-container { background:#0b132b; border:1px solid #1c2541; padding:40px; border-radius:24px; width:100%; max-width:400px; box-shadow:0 10px 30px rgba(0,0,0,0.5); text-align:center; }
        .logo { font-size:32px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; margin-bottom:10px; }
        .subtitle { color:#64748b; font-size:14px; margin-bottom:30px; }
        .form-group { text-align:left; margin-bottom:20px; }
        .form-group label { display:block; margin-bottom:8px; color:#94a3b8; font-size:13px; font-weight:600; }
        .form-group input { width:100%; padding:14px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:16px; transition:0.3s; }
        .form-group input:focus { border-color:#24ffff; outline:none; box-shadow:0 0 10px rgba(36,255,255,0.1); }
        .btn-login { width:100%; padding:16px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 0 15px rgba(255, 74, 162, 0.4); transition:0.3s; margin-top:10px; }
        .btn-login:hover { transform:translateY(-2px); box-shadow:0 0 20px rgba(255, 74, 162, 0.6); }
        .footer-link { margin-top:20px; font-size:13px; color:#64748b; }
        .footer-link a { color:#24ffff; text-decoration:none; font-weight:600; }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">⚡ LADES</div>
        <div class="subtitle">Tahmin pazarında ladesini başlat, tokenları topla!</div>
        
        <div class="form-group">
            <label>E-posta Adresi</label>
            <input type="email" id="email" placeholder="ornek@lades.com">
        </div>
        
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-login" onclick="handleLogin()">GİRİŞ YAP ⚡</button>
        
        <div class="footer-link">
            Hesabınız yok mu? <a href="register.html">Davet Kodu ile Kaydol</a>
        </div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
