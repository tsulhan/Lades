<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:#030814; min-height:100vh; overflow-x:hidden; color:white; }
        .screen { width:100%; min-height:100vh; position:relative; background:linear-gradient(180deg, rgba(3,8,20,.15) 0%, rgba(3,8,20,.45) 35%, rgba(3,8,20,.9) 100%); background-size:cover; }
        .overlay { position:absolute; inset:0; background:radial-gradient(circle at center, rgba(0,255,255,.08), transparent 60%); }
        .content { position:relative; z-index:10; width:100%; max-width:420px; margin:auto; padding:200px 28px 50px; }
        .logo-circle { width:130px; height:130px; margin:auto; border-radius:50%; border:4px solid #24ffff; box-shadow:0 0 25px #24ffff; display:flex; justify-content:center; align-items:center; }
        .bolt { font-size:80px; color:#24ffff; text-shadow:0 0 15px #24ffff; }
        .logo { text-align:center; margin-top:18px; font-size:76px; font-weight:900; letter-spacing:4px; color:#dffcff; text-shadow:0 0 12px rgba(36,255,255,.8); }
        .slogan { text-align:center; font-size:22px; margin-top:12px; }
        .blue { color:#21f8ff; } .white { color:#d4d7e0; } .pink { color:#ff4aa2; }
        .line { width:220px; height:2px; margin:18px auto 35px; background:linear-gradient(90deg, #21f8ff, #ff4aa2); }
        .features { display:flex; justify-content:space-between; text-align:center; margin-bottom:60px; }
        .feature { flex:1; }
        .icon { font-size:34px; margin-bottom:10px; }
        .cyan { color:#21f8ff; } .pink-icon { color:#ff4aa2; } .yellow { color:#ffd83b; }
        .login-btn { width:100%; height:92px; border:none; border-radius:50px; cursor:pointer; background:linear-gradient(90deg, #25ffff, #22dfd7); color:#05111b; font-size:30px; font-weight:800; display:flex; align-items:center; justify-content:center; gap:20px; box-shadow:0 0 15px rgba(37,255,255,.7); }
        .bottom-text { margin-top:55px; text-align:center; color:#aeb4c6; font-size:18px; line-height:1.6; }
    </style>
</head>
<body>

<div class="screen">
    <div class="overlay"></div>
    <div class="content">
        <div class="logo-circle"><div class="bolt">⚡</div></div>
        <div class="logo">LADES</div>
        <div class="slogan">
            <span class="blue">Tahmin et.</span>
            <span class="white"> Meydan oku.</span>
            <span class="pink"> Kazan.</span>
        </div>
        <div class="line"></div>
        <div class="features">
            <div class="feature"><div class="icon cyan">◎</div><p>Tahmin Et</p></div>
            <div class="feature"><div class="icon pink-icon">👥</div><p>Meydan Oku</p></div>
            <div class="feature"><div class="icon yellow">🏆</div><p>Kazan</p></div>
        </div>
        <button class="login-btn" onclick="alert('Form bağlantısı hazırlanıyor!')">GİRİŞ YAP →</button>
        <div class="bottom-text">
            <span style="font-size:28px; display:block; margin-bottom:8px;">👥</span>
            Arkadaşlarınla tahmin yap,<br>meydan oku ve liderlik tablosunda yüksel!
        </div>
    </div>
</div>

</body>
</html>
