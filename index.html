<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>LADES</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <h2>LADES</h2>
            <p style="color:var(--neon-cyan); font-size:12px;">TAHMİN ET. HİSSE AL. LADESİ KAZAN.</p>
            <input type="text" id="username" placeholder="Adınız Soyadınız">
            <button class="btn-neon" onclick="login()">GİRİŞ YAP ></button>
        </div>
    </div>

    <div id="app-screen" class="app-container hidden">
        <h1 id="page-title">LADESLER</h1>
        <div id="tab-listesi"><div id="lades-listesi"></div></div>
        <div id="tab-ekle" class="hidden card">
            <input type="text" id="rakip" placeholder="Rakip">
            <input type="text" id="odul" placeholder="Ödül">
            <button class="btn-neon" onclick="yeniLadesEkle()">EKLE</button>
        </div>
        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('listesi','LADESLER', this)">LİSTE</div>
            <div class="nav-item" onclick="switchTab('ekle','YENİ EKLE', this)">EKLE</div>
        </div>
    </div>
    <script src="src/js/firebase-config.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
