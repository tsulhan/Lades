<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .auth-container { width:100%; max-width:350px; text-align:center; }
        
        /* Logo Stili (Giriş için mavi tonlarında) */
        .logo-bolt { font-size:60px; color:#24ffff; margin-bottom:15px; text-shadow:0 0 20px #24ffff; }
        
        h2 { margin-bottom:25px; letter-spacing:1px; }
        
        input { width:100%; padding:18px; margin:8px 0; border-radius:12px; border:1px solid #333; background:#111; color:white; font-size:16px; }
        input::placeholder { color:#555; }
        
        .btn-login { width:100%; padding:20px; border-radius:50px; border:none; background:#24ffff; color:#05111b; font-weight:800; font-size:18px; cursor:pointer; margin-top:20px; box-shadow:0 0 15px #24ffff; }
        
        .register-link { color:#ff4aa2; text-decoration:underline; cursor:pointer; }
        .back-link { color:#888; margin-top:25px; display:block; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-bolt">⚡</div>
    
    <h2>GİRİŞ YAP</h2>
    
    <input type="email" id="email" placeholder="E-posta Adresi">
    <input type="password" id="password" placeholder="Şifre">
    
    <button class="btn-login">GİRİŞ YAP</button>
    
    <p style="color:#888; margin-top:20px; font-size:14px;">
        Hesabın yok mu? <a href="kayit_ol.html" class="register-link">Kayıt Ol</a>
    </p>
    
    <a href="index.html" class="back-link">← Geri Dön</a>
</div>

</body>
</html>
