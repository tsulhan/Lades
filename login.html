<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="src/js/firebase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #030814;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #0b132b;
            border: 1px solid #1c2541;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Neon Başlık */
        .neon-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            padding: 12px 0;
            background: linear-gradient(90deg, #ff4aa2, #24ffff, #ff4aa2);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neon-shine 3s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(36, 255, 255, 0.2), 0 0 60px rgba(255, 74, 162, 0.2);
            border-bottom: 2px solid rgba(36, 255, 255, 0.15);
            padding-bottom: 15px;
            line-height: 1.4;
        }

        @keyframes neon-shine {
            0% {
                background-position: 0% 50%;
                text-shadow: 0 0 20px rgba(36, 255, 255, 0.15), 0 0 40px rgba(255, 74, 162, 0.1);
            }
            50% {
                background-position: 100% 50%;
                text-shadow: 0 0 40px rgba(36, 255, 255, 0.3), 0 0 80px rgba(255, 74, 162, 0.2);
            }
            100% {
                background-position: 0% 50%;
                text-shadow: 0 0 20px rgba(36, 255, 255, 0.15), 0 0 40px rgba(255, 74, 162, 0.1);
            }
        }

        /* Neon ışık efekti için glitch çizgisi */
        .neon-title::before {
            content: '';
            position: absolute;
            top: 50%;
            left: -100%;
            width: 200%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(36, 255, 255, 0.3), rgba(255, 74, 162, 0.3), transparent);
            animation: neon-line 4s ease-in-out infinite;
        }

        @keyframes neon-line {
            0% { left: -100%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        .logo-icon {
            font-size: 45px;
            color: #24ffff;
            text-shadow: 0 0 15px #24ffff;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #1c2541;
            background: #030814;
            color: white;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #24ffff;
            box-shadow: 0 0 10px rgba(36, 255, 255, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: none;
            background: #24ffff;
            color: #030814;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(36, 255, 255, 0.35);
            transition: 0.3s;
        }

        .btn-login:hover {
            background: #1de6e6;
            transform: translateY(-1px);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
        }

        .footer-text a {
            color: #22c55e;
            font-weight: 700;
            text-decoration: none;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- ✅ NEON BAŞLIK -->
        <div class="neon-title">
            <i class="fa-solid fa-bolt" style="margin-right: 8px;"></i>
            18 ADAM 1 BURKAN<br>
            RESMİ LADES SİTESİNE<br>
            HOŞGELDİN
        </div>

        <div class="logo-icon">⚡</div>
        <h2>GİRİŞ YAP</h2>
        <div class="subtitle">
            LADES sistemine giriş yapmak için e-posta ve şifrenizi girin.
        </div>

        <div class="form-group">
            <label>E-posta Adresi</label>
            <input type="email" id="email" placeholder="ornek@domain.com">
        </div>

        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="btn-login" onclick="handleLogin()">GİRİŞ YAP ⚡</button>

        <div class="footer-text">
            Hesabınız yoksa <a href="kayit_ol.html">kayıt</a> olun.
        </div>
    </div>

    <script src="src/js/core.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
