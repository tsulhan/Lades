<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; }
        .auth-container { width:90%; max-width:350px; text-align:center; }
        .logo-bolt { font-size:60px; color:#24ffff; margin-bottom:20px; text-shadow:0 0 20px #24ffff; }
        input { width:100%; padding:18px; margin:10px 0; border-radius:12px; border:1px solid #333; background:#111; color:white; font-size:16px; }
        .btn-login { width:100%; padding:20px; border-radius:50px; border:none; background:#24ffff; color:#05111b; font-weight:800; font-size:18px; cursor:pointer; margin-top:20px; box-shadow:0 0 15px #24ffff; }
        .back-link { color:#888; margin-top:20px; display:block; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-bolt">⚡</div>
    <h2 style="margin-bottom:30px; letter-spacing:1px;">GİRİŞ YAP</h2>
    
    <input type="email" id="email" placeholder="E-posta Adresi">
    <input type="password" id="password" placeholder="Şifre">
    
    <button class="btn-login" onclick="alert('Firebase bağlantısı için hazırsın!')">GİRİŞ YAP</button>
    <p style="color:#888; margin-top:20px; font-size:14px;">
    Hesabın yok mu? 
    <a href="uye-ol.html" style="color:#ff4aa2; text-decoration:underline;">Kayıt Ol</a>
</p>
    <a href="index.html" class="back-link">← Geri Dön</a>
</div>

</body>
</html>
