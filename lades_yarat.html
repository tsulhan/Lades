<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Pazar Aç - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; flex-direction:column; }
        header { display:flex; justify-content:space-between; align-items:center; padding:20px 40px; background:#0b132b; border-bottom:1px solid #1c2541; }
        .logo { font-size:24px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; text-decoration:none; }
        .token-bag { background:rgba(36, 255, 255, 0.1); border:1px solid #24ffff; padding:10px 20px; border-radius:30px; font-weight:700; color:#24ffff; }
        
        main { flex:1; padding:40px; max-width:600px; width:100%; margin:0 auto; }
        h2 { margin-bottom:10px; font-weight:800; }
        .subtitle { color:#64748b; margin-bottom:30px; font-size:15px; }

        .form-group { margin-bottom:24px; }
        .form-group label { display:block; margin-bottom:8px; color:#94a3b8; font-size:14px; font-weight:600; }
        .form-group input { width:100%; padding:15px; border-radius:12px; border:1px solid #1c2541; background:#0b132b; color:white; font-size:16px; }
        
        .btn-submit { width:100%; padding:18px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:18px; cursor:pointer; box-shadow:0 0 15px #ff4aa2; }
        .back-link { display:block; text-align:center; color:#64748b; margin-top:20px; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="logo">⚡ LADES</a>
        <div class="token-bag">💰 <span id="token-balance">1000</span> TOKEN</div>
    </header>

    <main>
        <h2>Yeni Bir Tahmin Pazarı Oluştur</h2>
        <p class="subtitle">Herkesin EVET veya HAYIR seçeneğine token yatırabileceği bir lades konusu belirleyin.</p>
        
        <div class="form-group">
            <label>Lades Sorusunu Yazın</label>
            <input type="text" id="market-question" placeholder="Örn: Bu akşam maçı X takımı kazanır mı?">
        </div>
        
        <div class="form-group">
            <label>Pazar Bitiş Tarihi</label>
            <input type="date" id="market-date">
        </div>
        
        <button class="btn-submit" onclick="createNewMarket()">PAZARI YAYINA AL ⚡</button>
        <a href="dashboard.html" class="back-link">← Pazara Geri Dön</a>
    </main>

    <script src="src/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if(typeof updateUI === "function") updateUI();
        });
        
        function createNewMarket() {
            const q = document.getElementById('market-question').value;
            if(!q) return alert("Lütfen bir soru yazın!");
            alert("Harika! Pazarınız oluşturuldu. (Veritabanı bağlandığında listeye eklenecek)");
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
