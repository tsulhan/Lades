<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #111622;
            --primary-pink: #ff4081;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #707e94;
            --border-color: #1e2640;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(17, 22, 34, 0.8);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            color: var(--accent-cyan);
        }

        .logout-btn:hover {
            color: var(--primary-pink);
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Profil İçerik Alanı */
        .profile-container {
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* Kullanıcı Kartı */
        .user-card {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,229,255,0.2) 0%, rgba(11,14,20,0) 70%);
            border: 2px solid var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
        }

        .avatar-container i {
            font-size: 2.5rem;
            color: var(--accent-cyan);
        }

        .user-email {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Bakiye Alanı */
        .balance-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .balance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .balance-label .coin-icon {
            background-color: #ffb300;
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .balance-amount {
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Tab Menü Navigasyonu */
        .tabs-nav {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-link {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-link.active {
            color: var(--accent-cyan);
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--accent-cyan);
        }

        /* Tab İçerikleri */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Boş Durum Tasarımı (Uyarınız Üzerine Varsayılan Yapıldı) */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Dinamik Lades Kart Tasarımı (Veri Geldiğinde Görünecek) */
        .lades-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .lades-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .lades-progress-bar {
            display: flex;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .progress-evet {
            background-color: var(--accent-cyan);
            color: #000;
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .progress-hayir {
            background-color: var(--primary-pink);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            flex-grow: 1;
        }

        .lades-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .pool-info {
            color: var(--text-muted);
        }

        .user-bet {
            background-color: rgba(255, 179, 0, 0.1);
            color: #ffb300;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 179, 0, 0.2);
            font-weight: 600;
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }
        .status-win { background-color: rgba(0, 230, 118, 0.15); color: #00e676; }
        .status-lose { background-color: rgba(255, 23, 68, 0.15); color: #ff1744; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn" onclick="goToDashboard()" title="Dashboard'a Dön">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="nav-title">Profilim</div>
        <button class="nav-btn logout-btn" onclick="logout()" title="Çıkış Yap">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </nav>

    <main class="profile-container">
        
        <div class="user-card">
            <div class="avatar-container">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-email" id="userEmail">Yükleniyor...</div>
        </div>

        <div class="balance-box">
            <div class="balance-label">
                <div class="coin-icon">T</div>
                BAKİYE
            </div>
            <div class="balance-amount" id="userBalance">0 Token</div>
        </div>

        <div class="tabs-nav">
            <button class="tab-link active" onclick="switchTab(event, 'aktif-ladesler')">AKTİF LADESLERİM</button>
            <button class="tab-link" onclick="switchTab(event, 'gecmis-ozet')">GEÇMİŞ / ÖZET</button>
        </div>

        <div id="aktif-ladesler" class="tab-content active">
            <div id="aktifListContainer">
                <div class="empty-state">
                    Aktif katıldığınız lades bulunmuyor.
                </div>
            </div>
        </div>

        <div id="gecmis-ozet" class="tab-content">
            <div id="gecmisListContainer">
                <div class="empty-state">
                    Sonuçlanmış lades geçmişiniz bulunmuyor.
                </div>
            </div>
        </div>

    </main>

    <script>
        // Sayfa yüklendiğinde çalışacak ana fonksiyon
        document.addEventListener("DOMContentLoaded", () => {
            loadUserProfile();
            loadUserLadesHistory();
        });

        // 3) Aktif Kullanıcı Bilgilerini Getirme Fonksiyonu
        function loadUserProfile() {
            // Dashboard'a giriş yapmış güncel kullanıcıyı localStorage veya sessionStorage'dan çekiyoruz
            // Projenizde auth objesi neredeyse orayı bağlayabilirsiniz (Örn: auth.currentUser veya custom login verisi)
            const currentUserEmail = localStorage.getItem("loggedInUserEmail") || "test@lades.com"; 
            const currentUserTokens = localStorage.getItem("userTokens") || "2.000 Token";

            // Arayüze yazdırma
            document.getElementById("userEmail").innerText = currentUserEmail;
            document.getElementById("userBalance").innerText = currentUserTokens;
        }

        // 1) Dashboard'a Geri Dönüş Fonksiyonu
        function goToDashboard() {
            window.location.href = "dashboard.html";
        }

        // 2) Çıkış Yapma Fonksiyonu
        function logout() {
            // Oturum verilerini temizleme (İsteğe bağlı)
            // localStorage.removeItem("loggedInUserEmail"); 
            alert("Çıkış yapılıyor...");
            window.location.href = "index.html"; // veya giriş sayfanız hangisiyse
        }

        // Sekme Değiştirme Mantığı
        function switchTab(event, tabId) {
            const tabContents = document.querySelectorAll(".tab-content");
            tabContents.forEach(content => content.classList.remove("active"));

            const tabLinks = document.querySelectorAll(".tab-link");
            tabLinks.forEach(link => link.classList.remove("active"));

            document.getElementById(tabId).classList.add("active");
            event.currentTarget.classList.add("active");
        }

        // 4 & 5) Dinamik Lades Verilerini Yükleme Fonksiyonu (Örnek Entegrasyon Altyapısı)
        function loadUserLadesHistory() {
            // Bu kısım normal şartlarda DB'den (Firebase vb.) kullanıcının katıldığı lades id'lerine göre süzülür.
            // Örnek dinamik veri yapısı şöyledir (Veri geldiğinde boş durum kalkar ve listelenir):
            
            const userActiveLades = [
                /* Eğer aktif lades varsa şunun gibi objeler push edilecek:
                {
                    title: "Bu akşamki Beşiktaş maçı üst biter mi?",
                    evetYuzde: 65,
                    hayirYuzde: 35,
                    totalPool: "4500 T",
                    userChoice: "EVET (250 T)"
                } 
                */
            ];

            const userPastLades = [];

            // EĞER AKTİF LADES VARSA LİSTELE (Boşsa dokunma, default 'Bulunmuyor' yazısı kalır)
            if (userActiveLades.length > 0) {
                const aktifContainer = document.getElementById("aktifListContainer");
                aktifContainer.innerHTML = ""; // Boş durum yazısını temizle
                
                userActiveLades.forEach(item => {
                    aktifContainer.innerHTML += `
                        <div class="lades-card">
                            <div class="lades-title">${item.title}</div>
                            <div class="lades-progress-bar">
                                <div class="progress-evet" style="width: ${item.evetYuzde}%">EVET %${item.evetYuzde}</div>
                                <div class="progress-hayir" style="width: ${item.hayirYuzde}%">HAYIR %${item.hayirYuzde}</div>
                            </div>
                            <div class="lades-meta">
                                <div class="pool-info">Toplam Havuz: ${item.totalPool}</div>
                                <div class="user-bet">Tarafınız: ${item.userChoice}</div>
                            </div>
                        </div>
                    `;
                });
            }

            // EĞER GEÇMİŞ LADES VARSA LİSTELE
            if (userPastLades.length > 0) {
                const gecmisContainer = document.getElementById("gecmisListContainer");
                gecmisContainer.innerHTML = ""; // Boş durum yazısını temizle

                userPastLades.forEach(item => {
                    gecmisContainer.innerHTML += `
                        <div class="lades-card">
                            <div class="lades-title">${item.title}</div>
                            <div class="lades-meta">
                                <div class="pool-info">Toplam Havuz: ${item.totalPool}</div>
                                <div class="status-badge ${item.status === 'Kazandı' ? 'status-win' : 'status-lose'}">${item.status}</div>
                            </div>
                        </div>
                    `;
                });
            }
        }
    </script>
</body>
</html>
