<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030814;
            --card-bg: #0b132b;
            --primary-pink: #ff4aa2;
            --accent-cyan: #24ffff;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-color: #1c2541;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50px;
            text-decoration: none;
        }

        .nav-btn:hover {
            color: var(--accent-cyan);
            background: rgba(36, 255, 255, 0.05);
        }

        .logout-btn:hover {
            color: var(--primary-pink);
            background: rgba(255, 74, 162, 0.2);
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Profil İçerik Alanı */
        .profile-container {
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .user-card {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(36, 255, 255, 0.2) 0%, rgba(3, 8, 20, 0) 70%);
            border: 2px solid var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 15px rgba(36, 255, 255, 0.3);
        }

        .avatar-container i {
            font-size: 2.5rem;
            color: var(--accent-cyan);
        }

        .user-email {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Bakiye Alanı */
        .balance-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .balance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .balance-label .coin-icon {
            background-color: #ffb300;
            color: #030814;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .balance-amount {
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Tab Menü Navigasyonu */
        .tabs-nav {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-link {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-link:hover {
            color: white;
        }

        .tab-link.active {
            color: var(--accent-cyan);
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Lades Kartı Tasarımı */
        .lades-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .lades-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .lades-progress-bar {
            display: flex;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .progress-evet {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .progress-hayir {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            flex-grow: 1;
        }

        .lades-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .pool-info {
            color: var(--text-muted);
        }

        .user-bet {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn" onclick="goToDashboard()" title="Dashboard'a Dön">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="nav-title">Profilim</div>
        <button class="nav-btn logout-btn" onclick="logout()" title="Çıkış Yap">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </nav>

    <main class="profile-container">
        <div class="user-card">
            <div class="avatar-container">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-email" id="userEmail">tsulhan@gmail.com</div>
        </div>

        <div class="balance-box">
            <div class="balance-label">
                <div class="coin-icon">T</div>
                BAKİYE
            </div>
            <div class="balance-amount" id="userBalance">3.600 Token</div>
        </div>

        <div class="tabs-nav">
            <button class="tab-link active" onclick="switchTab(event, 'aktif-ladesler')">AKTİF LADESLERİM</button>
            <button class="tab-link" onclick="switchTab(event, 'gecmis-ozet')">GEÇMİŞ / ÖZET</button>
        </div>

        <div id="aktif-ladesler" class="tab-content active">
            <div id="aktifListContainer">
                <div class="lades-card">
                    <div class="lades-title">bedo padele başlar mı?</div>
                    <div class="lades-progress-bar">
                        <div class="progress-evet" style="width: 64%">EVET %64</div>
                        <div class="progress-hayir" style="width: 36%">HAYIR %36</div>
                    </div>
                    <div class="lades-meta">
                        <div class="pool-info">Toplam Hacim: 6.900 Token</div>
                        <div class="user-bet">Tarafınız: HAYIR (500 T)</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="gecmis-ozet" class="tab-content">
            <div id="gecmisListContainer">
                <div class="empty-state">Sonuçlanmış lades geçmişiniz bulunmuyor.</div>
            </div>
        </div>
    </main>

    <script>
        const FIREBASE_DB_URL = "https://lades-app-2027-default-rtdb.firebaseio.com";

        document.addEventListener("DOMContentLoaded", () => {
            loadProfileData();
        });

        async function loadProfileData() {
            const email = localStorage.getItem("loggedInUserEmail") || 
                          localStorage.getItem("currentUser") || 
                          localStorage.getItem("userEmail") || 
                          "tsulhan@gmail.com";

            document.getElementById("userEmail").innerText = email;
            const userKey = email.replace(/\./g, "_");

            const cachedTokens = localStorage.getItem("userTokens") || localStorage.getItem("userBalance");
            if (cachedTokens) {
                document.getElementById("userBalance").innerText = formatToken(cachedTokens);
            }

            try {
                // REST API ile hızlı bakiye çekimi
                const userRes = await fetch(`${FIREBASE_DB_URL}/users/${userKey}.json`);
                if (userRes.ok) {
                    const userData = await userRes.json();
                    if (userData && userData.tokens !== undefined) {
                        document.getElementById("userBalance").innerText = Number(userData.tokens).toLocaleString('tr-TR') + " Token";
                        localStorage.setItem("userTokens", userData.tokens);
                    }
                }

                // REST API ile lades market veri sorgusu
                const marketsRes = await fetch(`${FIREBASE_DB_URL}/markets.json`);
                if (marketsRes.ok) {
                    const markets = await marketsRes.json();
                    if (markets) {
                        buildMarketsList(email, markets);
                    }
                }
            } catch (err) {
                console.warn("REST API yedekleme modu devrede.", err);
            }
        }

        function buildMarketsList(userEmail, markets) {
            const container = document.getElementById("aktifListContainer");
            let htmlContent = "";

            Object.keys(markets).forEach(id => {
                const market = markets[id];
                let hasBet = false;
                let betAmt = 0;
                let betSide = "HAYIR";

                if (market.bets) {
                    const safeKey = userEmail.replace(/\./g, "_");
                    const betObj = market.bets[safeKey] || market.bets[userEmail];
                    if (betObj) {
                        hasBet = true;
                        betAmt = betObj.amount || betObj;
                        betSide = betObj.choice || "HAYIR";
                    }
                }

                if (hasBet && (market.status === "ACTIVE" || !market.status)) {
                    htmlContent += `
                        <div class="lades-card">
                            <div class="lades-title">${market.question}</div>
                            <div class="lades-progress-bar">
                                <div class="progress-evet" style="width: ${market.evetYuzde || 64}%">EVET %${market.evetYuzde || 64}</div>
                                <div class="progress-hayir" style="width: ${market.hayirYuzde || 36}%">HAYIR %${market.hayirYuzde || 36}</div>
                            </div>
                            <div class="lades-meta">
                                <div class="pool-info">Toplam Hacim: ${Number(market.totalPool || 6900).toLocaleString('tr-TR')} Token</div>
                                <div class="user-bet">Tarafınız: ${betSide} (${Number(betAmt).toLocaleString('tr-TR')} T)</div>
                            </div>
                        </div>
                    `;
                }
            });

            if (htmlContent !== "") {
                container.innerHTML = htmlContent;
            }
        }

        function formatToken(val) {
            let num = val.toString().replace(/[^0-9]/g, '');
            return num ? Number(num).toLocaleString('tr-TR') + " Token" : "3.600 Token";
        }

        function goToDashboard() {
            window.location.href = "dashboard.html";
        }

        function logout() {
            localStorage.clear();
            window.location.replace("index.html"); 
        }

        function switchTab(event, tabId) {
            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab-link").forEach(l => l.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
            event.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
