<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // Giriş Kontrolü
        const user = localStorage.getItem('currentUser');
        if (!user || user === 'null' || user === 'undefined' || user.trim() === '') {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="src/js/firebase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #030814;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #0b132b;
            border-bottom: 1px solid #1c2541;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #24ffff;
            text-shadow: 0 0 10px #24ffff;
            text-decoration: none;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-email-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1c2541;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        .token-bag {
            background: rgba(36, 255, 255, 0.1);
            border: 1px solid #24ffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            color: #24ffff;
            box-shadow: 0 0 10px rgba(36, 255, 255, 0.2);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            padding: 8px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover, .icon-btn.active {
            color: #24ffff;
            background: rgba(36, 255, 255, 0.05);
        }

        .btn-logout {
            color: #ff4aa2;
            margin-left: 10px;
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 650px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-container {
            background: #0b132b;
            border: 1px solid #1c2541;
            padding: 35px;
            border-radius: 24px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: rgba(36, 255, 255, 0.1);
            border: 2px solid #24ffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #24ffff;
            margin: 0 auto 15px auto;
        }

        .username-display {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 25px;
        }

        .tabs-header {
            display: flex;
            background: #030814;
            border: 1px solid #1c2541;
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 20px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s ease;
        }

        .tab-btn.active {
            background: #1c2541;
            color: #24ffff;
        }

        .tabs-content {
            background: #030814;
            border: 1px solid #1c2541;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            min-height: 200px;
            max-height: 320px;
            overflow-y: auto;
            text-align: left;
        }

        .lades-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            border-bottom: 1px solid #1c2541;
            background: rgba(255, 255, 255, 0.01);
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .lades-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .lades-title {
            font-size: 14px;
            font-weight: 700;
            color: #f8fafc;
        }

        .lades-side {
            font-size: 11px;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            width: fit-content;
        }

        .lades-amount {
            font-size: 13px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .amount-active { background: rgba(36, 255, 255, 0.08); color: #24ffff; border: 1px solid rgba(36, 255, 255, 0.2); }
        .amount-win { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .amount-lose { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #475569;
            height: 160px;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: 1px solid #1c2541;
            background: rgba(255, 255, 255, 0.02);
            color: #94a3b8;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="logo">⚡ LADES</a>
        <div class="header-center">
            <div id="user-email-badge" class="user-email-badge">...</div>
            <div class="token-bag">💰 <span id="token-balance">0</span> TOKEN</div>
            <a href="profil.html" class="icon-btn active"><i class="fa-solid fa-user"></i></a>
            <button class="icon-btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <div class="profile-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
            <div id="profile-username" class="username-display">...</div>

            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('active')">Aktif Ladesler</button>
                <button class="tab-btn" onclick="switchTab('history')">Geçmiş</button>
            </div>

            <div id="tab-content" class="tabs-content">
                <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> Veriler kontrol ediliyor...</div>
            </div>

            <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Dashboard'a Geri Dön</a>
        </div>
    </main>

    <script src="src/js/core.js"></script>
    <script src="src/js/app.js"></script>

    <script>
        let currentActiveTab = 'active';
        let allUserLadesData = [];

        document.addEventListener("DOMContentLoaded", () => {
            const currentUser = localStorage.getItem('currentUser');
            if (!currentUser) return;

            document.getElementById('user-email-badge').innerText = currentUser;
            document.getElementById('profile-username').innerText = currentUser;

            const userKey = currentUser.replace(/\./g, '_');

            if (typeof db !== 'undefined') {
                // Üst Bar Bakiye Senkronizasyonu
                db.ref('users/' + userKey).on('value', (snapshot) => {
                    const userData = snapshot.val();
                    if (userData) {
                        const currentTokens = userData.tokens || userData.token || 0;
                        document.getElementById('token-balance').innerText = Number(currentTokens).toLocaleString('tr-TR');
                    }
                });

                // Gelişmiş Derin Veri Tarayıcı (Deep Scanner)
                db.ref('ladesler').on('value', (snapshot) => {
                    const ladesler = snapshot.val();
                    allUserLadesData = [];

                    if (ladesler) {
                        Object.keys(ladesler).forEach(ladesId => {
                            const lades = ladesler[ladesId];
                            let hasParticipated = false;
                            let extractedBet = { side: 'Belirsiz', amount: 300, result: 0 };

                            // Kural 1: Nesneyi stringe çevirip kullanıcının varlığını kontrol et
                            const stringified = JSON.stringify(lades).toLowerCase();
                            const lookForRaw = currentUser.toLowerCase();
                            const lookForClean = userKey.toLowerCase();

                            if (stringified.includes(lookForRaw) || stringified.includes(lookForClean)) {
                                hasParticipated = true;

                                // Kural 2: Veri yapısı nerede olursa olsun derinlemesine kazı ve eşleşeni çıkar
                                function searchDeep(obj) {
                                    if (!obj || typeof obj !== 'object') return;
                                    
                                    // Eğer anahtar kelime direkt kullanıcının key'i ise
                                    if (obj[userKey] || obj[currentUser]) {
                                        const match = obj[userKey] || obj[currentUser];
                                        extractedBet.side = match.side || match.choice || extractedBet.side;
                                        extractedBet.amount = match.amount || match.invested || extractedBet.amount;
                                        extractedBet.result = match.result || 0;
                                        return;
                                    }

                                    // Klasik dizi veya alt objeleri tara
                                    for (let key in obj) {
                                        if (key.toLowerCase() === lookForRaw || key.toLowerCase() === lookForClean) {
                                            extractedBet.side = obj[key].side || obj[key].choice || extractedBet.side;
                                            extractedBet.amount = obj[key].amount || obj[key].invested || extractedBet.amount;
                                            extractedBet.result = obj[key].result || 0;
                                        }
                                        if (typeof obj[key] === 'object') {
                                            searchDeep(obj[key]);
                                        }
                                    }
                                }
                                searchDeep(lades);

                                const status = lades.status || ((lades.isOpen === false || lades.isClosed === true) ? 'closed' : 'open');

                                allUserLadesData.push({
                                    id: ladesId,
                                    title: lades.title || 'Lades Bahsi',
                                    status: status,
                                    invested: extractedBet.amount,
                                    side: extractedBet.side,
                                    result: extractedBet.result
                                });
                            }
                        });
                    }
                    renderLadesList();
                });
            }
        });

        function switchTab(tabName) {
            currentActiveTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(tabName === 'active') document.querySelectorAll('.tab-btn')[0].classList.add('active');
            else document.querySelectorAll('.tab-btn')[1].classList.add('active');
            renderLadesList();
        }

        function renderLadesList() {
            const contentArea = document.getElementById('tab-content');
            contentArea.innerHTML = '';

            const filtered = allUserLadesData.filter(item => {
                return currentActiveTab === 'active' ? (item.status === 'open' || item.status === 'active') : (item.status === 'closed' || item.status === 'finished');
            });

            if (filtered.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-gamepad" style="font-size: 24px; color: #1c2541;"></i>
                        <span>Bu sekmede listelenecek lades verisi bulunamadı.</span>
                    </div>`;
                return;
            }

            filtered.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'lades-item';

                let amountBadge = '';
                if (currentActiveTab === 'active') {
                    amountBadge = `<span class="lades-amount amount-active">${item.invested} TOKEN</span>`;
                } else {
                    if (item.result > 0) amountBadge = `<span class="lades-amount amount-win">+${item.result} TOKEN</span>`;
                    else if (item.result < 0) amountBadge = `<span class="lades-amount amount-lose">${item.result} TOKEN</span>`;
                    else amountBadge = `<span class="lades-amount amount-lose">-${item.invested} TOKEN</span>`;
                }

                itemDiv.innerHTML = `
                    <div class="lades-info">
                        <span class="lades-title">${item.title}</span>
                        <div class="lades-side">Tarafınız: ${item.side.toUpperCase()}</div>
                    </div>
                    <div>${amountBadge}</div>
                `;
                contentArea.appendChild(itemDiv);
            });
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
