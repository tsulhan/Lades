<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // KESİN GİRİŞ KONTROLÜ
        const user = localStorage.getItem('currentUser');
        if (!user || user === 'null' || user === 'undefined' || user.trim() === '') {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="src/js/firebase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #030814;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #0b132b;
            border-bottom: 1px solid #1c2541;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #24ffff;
            text-shadow: 0 0 10px #24ffff;
            text-decoration: none;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-email-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1c2541;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .token-bag {
            background: rgba(36, 255, 255, 0.1);
            border: 1px solid #24ffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            color: #24ffff;
            box-shadow: 0 0 10px rgba(36, 255, 255, 0.2);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            padding: 8px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover, .icon-btn.active {
            color: #24ffff;
            background: rgba(36, 255, 255, 0.05);
        }

        .btn-logout {
            color: #ff4aa2;
            margin-left: 10px;
        }

        .btn-logout:hover {
            color: white;
            background: rgba(255, 74, 162, 0.2);
        }

        main {
            flex: 1;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-container {
            background: #0b132b;
            border: 1px solid #1c2541;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-avatar {
            width: 90px;
            height: 90px;
            background: rgba(36, 255, 255, 0.1);
            border: 2px solid #24ffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #24ffff;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(36, 255, 255, 0.2);
        }

        .profile-container h2 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 5px;
            color: #fff;
        }

        .profile-container .email-text {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .info-card {
            background: #030814;
            border: 1px solid #1c2541;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .info-card .label {
            font-size: 12px;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .info-card .value {
            font-size: 32px;
            font-weight: 800;
            color: #24ffff;
            text-shadow: 0 0 10px rgba(36, 255, 255, 0.3);
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            border: 1px solid #1c2541;
            background: rgba(255, 255, 255, 0.02);
            color: #94a3b8;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border-color: #334155;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }
            main {
                padding: 20px;
            }
            .profile-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="logo">⚡ LADES</a>
        <div class="header-center">
            <div id="user-email-badge" class="user-email-badge">yükleniyor...</div>
            
            <div class="token-bag">💰 <span id="token-balance">0</span> TOKEN</div>

            <a href="profil.html" class="icon-btn active" title="Profilim">
                <i class="fa-solid fa-user"></i>
            </a>

            <button class="icon-btn btn-logout" onclick="logout()" title="Çıkış Yap">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </header>

    <main>
        <div class="profile-container">
            <div class="profile-avatar">
                <i class="fa-solid fa-user-astronaut"></i>
            </div>
            <h2>Kullanıcı Profili</h2>
            <div id="profile-email-text" class="email-text">yükleniyor...</div>

            <div class="info-card">
                <span class="label">Mevcut Toplam Bakiye</span>
                <span id="profile-token-display" class="value">...</span>
            </div>

            <a href="dashboard.html" class="btn-back">
                <i class="fa-solid fa-arrow-left"></i> Dashboard'a Geri Dön
            </a>
        </div>
    </main>

    <script src="src/js/core.js"></script>
    <script src="src/js/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const currentUser = localStorage.getItem('currentUser');
            
            if (currentUser) {
                // E-posta alanlarını yerleştir
                document.getElementById('user-email-badge').innerText = currentUser;
                document.getElementById('profile-email-text').innerText = currentUser;

                // Firebase Realtime Database Canlı Dinleyicisi (on value)
                // E-posta adresindeki noktaları alt tireye çeviriyoruz (Örn: isim.soyisim@gmail.com -> isim_soyisim@gmail_com)
                const userKey = currentUser.replace(/\./g, '_');
                
                if (typeof db !== 'undefined') {
                    db.ref('users/' + userKey).on('value', (snapshot) => {
                        const userData = snapshot.val();
                        if (userData) {
                            // Veritabanındaki token veya tokens key'ini kontrol et
                            const currentTokens = userData.tokens || userData.token || 0;
                            
                            // Hem sağ üst köşedeki hem de profil ortasındaki büyük token değerini eşzamanlı güncelle
                            document.getElementById('token-balance').innerText = currentTokens;
                            document.getElementById('profile-token-display').innerText = Number(currentTokens).toLocaleString('tr-TR') + " 💰";
                        }
                    });
                } else {
                    // Eğer core.js/app.js dosyaları Firebase'i zaten başlatıp global bir dinleyici kuruyorsa,
                    // yerel saklama alanındaki değişiklikleri yakalamak için bir fallback tetikleyelim.
                    setInterval(() => {
                        const globalTokenElement = document.getElementById('token-balance');
                        const localDisplayElement = document.getElementById('profile-token-display');
                        if (globalTokenElement && localDisplayElement && globalTokenElement.innerText !== "0") {
                            localDisplayElement.innerText = globalTokenElement.innerText + " 💰";
                        }
                    }, 500);
                }
            }
        });

        // Çıkış Yap Fonksiyonu
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
