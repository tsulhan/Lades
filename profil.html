<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        // Giriş Kontrolü
        const user = localStorage.getItem('currentUser');
        if (!user || user === 'null' || user === 'undefined' || user.trim() === '') {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="src/js/firebase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #030814;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: #0b132b;
            border-bottom: 1px solid #1c2541;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #24ffff;
            text-shadow: 0 0 10px #24ffff;
            text-decoration: none;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-email-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #1c2541;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }

        .token-bag {
            background: rgba(36, 255, 255, 0.1);
            border: 1px solid #24ffff;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            color: #24ffff;
            box-shadow: 0 0 10px rgba(36, 255, 255, 0.2);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            padding: 8px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover, .icon-btn.active {
            color: #24ffff;
            background: rgba(36, 255, 255, 0.05);
        }

        .btn-logout {
            color: #ff4aa2;
            margin-left: 10px;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-container {
            background: #0b132b;
            border: 1px solid #1c2541;
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(28, 37, 65, 0.6);
        }

        .profile-user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
        }

        .profile-avatar {
            width: 64px;
            height: 64px;
            background: rgba(36, 255, 255, 0.1);
            border: 2px solid #24ffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #24ffff;
        }

        .username-display {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .btn-back-header {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(36, 255, 255, 0.05);
            border: 1px solid rgba(36, 255, 255, 0.2);
            color: #24ffff;
            padding: 10px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .btn-back-header:hover {
            background: rgba(36, 255, 255, 0.15);
            border-color: #24ffff;
            box-shadow: 0 0 12px rgba(36, 255, 255, 0.2);
        }

        .tabs-header {
            display: flex;
            background: #030814;
            border: 1px solid #1c2541;
            border-radius: 14px;
            padding: 6px;
            margin-bottom: 25px;
            gap: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s ease;
        }

        .tab-btn.active {
            background: #1c2541;
            color: #24ffff;
        }

        .tabs-content {
            background: #030814;
            border: 1px solid #1c2541;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 10px;
            min-height: 250px;
            max-height: 550px;
            overflow-y: auto;
            text-align: left;
        }

        .user-bet-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #1c2541;
            padding: 20px 24px;
            border-radius: 14px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: 0.2s;
        }

        .user-bet-card:hover {
            border-color: rgba(36, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.04);
        }

        .bet-details h3 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .bet-details p {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 0.3px;
        }

        .badge-choice {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .badge-yes { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
        .badge-no { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-draw { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }

        .bet-stats {
            display: flex;
            gap: 25px;
            text-align: right;
            flex-shrink: 0;
            align-items: center;
        }

        .stat-box .lbl {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-box .val {
            font-size: 14px;
            font-weight: 800;
        }

        .result-win { color: #4ade80; font-weight: 700; }
        .result-lose { color: #f87171; font-weight: 700; }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .user-email-badge { display: none; }
            main { padding: 15px 10px; }
            .profile-container { padding: 20px 15px; border-radius: 16px; }
            .profile-top-bar { flex-direction: column; align-items: flex-start; gap: 15px; }
            .btn-back-header { width: 100%; justify-content: center; }
            .tabs-content { padding: 12px; }
            .user-bet-card { flex-direction: column; align-items: flex-start; gap: 15px; padding: 16px; }
            .bet-stats { width: 100%; justify-content: space-between; text-align: left; border-top: 1px solid #1c2541; padding-top: 12px; gap: 10px; }
            .stat-box { flex: 1; }
            .stat-box:last-child { text-align: right; }
        }
    </style>
</head>
<body>

    <header>
        <a href="dashboard.html" class="logo">⚡ LADES</a>
        <div class="header-center">
            <div id="user-email-badge" class="user-email-badge">...</div>
            <div class="token-bag">💰 <span id="token-balance">0</span> TOKEN</div>
            <a href="profil.html" class="icon-btn active"><i class="fa-solid fa-user"></i></a>
            <button class="icon-btn btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </header>

    <main>
        <div class="profile-container">
            
            <div class="profile-top-bar">
                <div class="profile-user-info">
                    <div class="profile-avatar"><i class="fa-solid fa-user-astronaut"></i></div>
                    <div id="profile-username" class="username-display">...</div>
                </div>
                
                <a href="dashboard.html" class="btn-back-header">
                    <i class="fa-solid fa-arrow-left"></i> Dashboard'a Dön
                </a>
            </div>

            <div class="tabs-header">
                <button id="tab-active-btn" class="tab-btn active" onclick="toggleProfileTab('active')">Aktif Ladesler</button>
                <button id="tab-past-btn" class="tab-btn" onclick="toggleProfileTab('past')">Geçmiş</button>
            </div>

            <div id="profile-active-bets" class="tabs-content">
                <div style="text-align:center; color:#64748b; padding:30px; font-size:14px;">
                    <i class="fa-solid fa-spinner fa-spin"></i> Veriler yükleniyor...
                </div>
            </div>

            <div id="profile-past-bets" class="tabs-content" style="display: none;">
                <div style="text-align:center; color:#64748b; padding:30px; font-size:14px;">
                    <i class="fa-solid fa-spinner fa-spin"></i> Veriler yükleniyor...
                </div>
            </div>

        </div>
    </main>

    <!-- ✅ DOĞRU SIRA: Önce core.js, sonra app-functions.js, sonra app.js -->
    <script src="src/js/core.js"></script>
    <script src="src/js/app-functions.js"></script>
    <script src="src/js/app.js"></script>

    <script>
        // ✅ Profil sayfası özel başlatma
        document.addEventListener("DOMContentLoaded", function() {
            console.log("📋 Profil sayfası başlatılıyor...");
            
            // Kullanıcı adını göster
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                document.getElementById('user-email-badge').innerText = currentUser;
                
                // Nickname'i al ve göster
                if (typeof getUserNickname === 'function') {
                    getUserNickname(currentUser).then(nickname => {
                        document.getElementById('profile-username').innerText = nickname || currentUser;
                    });
                }
            }
            
            // Token bakiyesini güncelle
            if (typeof db !== 'undefined' && currentUser) {
                const userCleanKey = currentUser.replace(/\./g, ',');
                fbRef(`ladesUsers/${userCleanKey}`).on("value", (snapshot) => {
                    const userVal = snapshot.val();
                    if (userVal) {
                        document.getElementById("token-balance").innerText = (userVal.balance || 0).toLocaleString("tr-TR");
                    }
                });
            }

            // Profil bahislerini yükle
            if (typeof initProfilePage === 'function') {
                initProfilePage();
            } else {
                console.error("❌ initProfilePage fonksiyonu bulunamadı!");
            }
        });

        // Aktif / Geçmiş Sekme Değişim Mantığı
        function toggleProfileTab(tabType) {
            const activeContainer = document.getElementById("profile-active-bets");
            const pastContainer = document.getElementById("profile-past-bets");
            const activeBtn = document.getElementById("tab-active-btn");
            const pastBtn = document.getElementById("tab-past-btn");

            if (tabType === 'active') {
                activeContainer.style.display = "block";
                pastContainer.style.display = "none";
                activeBtn.classList.add("active");
                pastBtn.classList.remove("active");
            } else {
                activeContainer.style.display = "none";
                pastContainer.style.display = "block";
                activeBtn.classList.remove("active");
                pastBtn.classList.add("active");
            }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
