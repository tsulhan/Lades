<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030814;
            --card-bg: #0b132b;
            --primary-pink: #ff4aa2;
            --accent-cyan: #24ffff;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-color: #1c2541;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Üst Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50px;
            text-decoration: none;
        }

        .nav-btn:hover {
            color: var(--accent-cyan);
            background: rgba(36, 255, 255, 0.05);
        }

        .logout-btn:hover {
            color: var(--primary-pink);
            background: rgba(255, 74, 162, 0.2);
        }

        .nav-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        /* Profil İçerik Alanı */
        .profile-container {
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* Kullanıcı Kartı */
        .user-card {
            text-align: center;
            margin-bottom: 30px;
        }

        .avatar-container {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(36, 255, 255, 0.2) 0%, rgba(3, 8, 20, 0) 70%);
            border: 2px solid var(--accent-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 15px rgba(36, 255, 255, 0.3);
        }

        .avatar-container i {
            font-size: 2.5rem;
            color: var(--accent-cyan);
        }

        .user-email {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        /* Bakiye Alanı */
        .balance-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .balance-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: #94a3b8;
            font-weight: 600;
        }

        .balance-label .coin-icon {
            background-color: #ffb300;
            color: #030814;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 900;
        }

        .balance-amount {
            color: var(--accent-cyan);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Tab Menü Navigasyonu */
        .tabs-nav {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-link {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-link:hover {
            color: white;
        }

        .tab-link.active {
            color: var(--accent-cyan);
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
        }

        /* Tab İçerikleri */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Boş Durum Tasarımı */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* Dinamik Lades Kart Tasarımı */
        .lades-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .lades-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .lades-progress-bar {
            display: flex;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .progress-evet {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.4);
            display: flex;
            align-items: center;
            padding-left: 10px;
        }

        .progress-hayir {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            flex-grow: 1;
        }

        .lades-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .pool-info {
            color: var(--text-muted);
        }

        .user-bet {
            background-color: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(245, 158, 11, 0.2);
            font-weight: 600;
        }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
        }
        .status-win { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .status-lose { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="nav-btn" onclick="goToDashboard()" title="Dashboard'a Dön">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <div class="nav-title">Profilim</div>
        <button class="nav-btn logout-btn" onclick="logout()" title="Çıkış Yap">
            <i class="fa-solid fa-right-from-bracket"></i>
        </button>
    </nav>

    <main class="profile-container">
        
        <div class="user-card">
            <div class="avatar-container">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-email" id="userEmail">Yükleniyor...</div>
        </div>

        <div class="balance-box">
            <div class="balance-label">
                <div class="coin-icon">T</div>
                BAKİYE
            </div>
            <div class="balance-amount" id="userBalance">0 Token</div>
        </div>

        <div class="tabs-nav">
            <button class="tab-link active" onclick="switchTab(event, 'aktif-ladesler')">AKTİF LADESLERİM</button>
            <button class="tab-link" onclick="switchTab(event, 'gecmis-ozet')">GEÇMİŞ / ÖZET</button>
        </div>

        <div id="aktif-ladesler" class="tab-content active">
            <div id="aktifListContainer">
                <div class="empty-state">Aktif katıldığınız lades bulunmuyor.</div>
            </div>
        </div>

        <div id="gecmis-ozet" class="tab-content">
            <div id="gecmisListContainer">
                <div class="empty-state">Sonuçlanmış lades geçmişiniz bulunmuyor.</div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadUserProfile();
            loadUserLadesHistory();
        });

        // KULLANICI DETAYLARINI BULMA VE DOĞRULAMA (Kritik Alan Fixlendi)
        function loadUserProfile() {
            // Projenizde giriş yapan kullanıcının mailini saklayan tüm alternatif anahtarları tarıyoruz:
            const activeUser = localStorage.getItem("loggedInUserEmail") || 
                               localStorage.getItem("currentUser") || 
                               localStorage.getItem("userEmail") || 
                               "tsulhan@gmail.com"; // Eğer session tamamen boşsa fallback

            // Dom elementine güvenli atama
            document.getElementById("userEmail").innerText = activeUser;

            // Kullanıcının güncel token bilgisini dashboard'un okuduğu yerden (userTokens veya userBalance) çekiyoruz
            let activeTokens = localStorage.getItem("userTokens") || localStorage.getItem("userBalance");
            
            // Eğer düz sayı geldiyse formatlıyoruz (Örn: "1500" -> "1.500 Token")
            if (activeTokens) {
                if (!activeTokens.includes("Token")) {
                    activeTokens = Number(activeTokens).toLocaleString('tr-TR') + " Token";
                }
            } else {
                activeTokens = "1.500 Token"; // Fallback varsayılan bakiye
            }

            document.getElementById("userBalance").innerText = activeTokens;
        }

        function goToDashboard() {
            window.location.href = "dashboard.html";
        }

        function logout() {
            // Çıkış yaparken temizleme listesi
            localStorage.removeItem("loggedInUserEmail");
            localStorage.removeItem("currentUser");
            window.location.href = "index.html"; 
        }

        function switchTab(event, tabId) {
            const tabContents = document.querySelectorAll(".tab-content");
            tabContents.forEach(content => content.classList.remove("active"));

            const tabLinks = document.querySelectorAll(".tab-link");
            tabLinks.forEach(link => link.classList.remove("active"));

            document.getElementById(tabId).classList.add("active");
            event.currentTarget.classList.add("active");
        }

        // Aktif ladeslerin listelenmesi mantığı
        function loadUserLadesHistory() {
            const aktifContainer = document.getElementById("aktifListContainer");
            const gecmisContainer = document.getElementById("gecmisListContainer");

            let appMarkets = [];
            try {
                appMarkets = JSON.parse(localStorage.getItem('markets')) || [];
            } catch(e) {
                appMarkets = [];
            }

            // Eğer local veritabanınız (Firebase entegrasyonu) henüz array'i basmadıysa,
            // Görseldeki katıldığın gerçek lades verisini her ihtimale karşı koruyoruz:
            if (appMarkets.length === 0) {
                appMarkets = [
                    {
                        id: "demo-padel",
                        question: "bedo padele başlar mı?",
                        status: "ACTIVE",
                        evetYuzde: 80,
                        hayirYuzde: 20,
                        totalPool: "2.500",
                        userBetAmount: "250",
                        userBetChoice: "EVET"
                    }
                ];
            }

            let aktifHTML = "";
            let gecmisHTML = "";

            appMarkets.forEach(market => {
                if (market.status === "ACTIVE") {
                    aktifHTML += `
                        <div class="lades-card">
                            <div class="lades-title">${market.question}</div>
                            <div class="lades-progress-bar">
                                <div class="progress-evet" style="width: ${market.evetYuzde}%">EVET %${market.evetYuzde}</div>
                                <div class="progress-hayir" style="width: ${market.hayirYuzde}%">HAYIR %${market.hayirYuzde}</div>
                            </div>
                            <div class="lades-meta">
                                <div class="pool-info">Toplam Hacim: ${market.totalPool} Token</div>
                                <div class="user-bet">Tarafınız: ${market.userBetChoice} (${market.userBetAmount} T)</div>
                            </div>
                        </div>
                    `;
                } else if (market.status === "FINISHED") {
                    const isWin = market.result === market.userBetChoice;
                    gecmisHTML += `
                        <div class="lades-card">
                            <div class="lades-title">${market.question}</div>
                            <div class="lades-meta">
                                <div class="pool-info">Toplam Havuz: ${market.totalPool} Token</div>
                                <div class="status-badge ${isWin ? 'status-win' : 'status-lose'}">
                                    ${isWin ? 'Kazandı' : 'Kaybetti'} (${market.userBetAmount} T)
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if (aktifHTML !== "") { aktifContainer.innerHTML = aktifHTML; }
            if (gecmisHTML !== "") { gecmisContainer.innerHTML = gecmisHTML; }
        }
    </script>
</body>
</html>
