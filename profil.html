<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilim - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #030814;
            --card-bg: #0b132b;
            --primary-pink: #ff4aa2;
            --accent-cyan: #24ffff;
            --text-main: #ffffff;
            --text-muted: #64748b;
            --border-color: #1c2541;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* Üst Menü / Navbar */
        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 40px; background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100;
        }

        .nav-btn {
            background: none; border: none; color: #888; font-size: 1.2rem; cursor: pointer;
            transition: 0.3s; display: flex; align-items: center; justify-content: center;
            padding: 8px; border-radius: 50px; text-decoration: none;
        }

        .nav-btn:hover { color: var(--accent-cyan); background: rgba(36, 255, 255, 0.05); }
        .logout-btn:hover { color: var(--primary-pink); background: rgba(255, 74, 162, 0.1); }
        .nav-title { font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; }

        /* Profil Konteyner */
        .profile-container { max-width: 650px; width: 100%; margin: 40px auto; padding: 0 20px; flex: 1; }
        
        .user-card { text-align: center; margin-bottom: 30px; }
        .avatar-container {
            width: 90px; height: 90px; border-radius: 50%;
            background: radial-gradient(circle, rgba(36, 255, 255, 0.2) 0%, rgba(3, 8, 20, 0) 70%);
            border: 2px solid var(--accent-cyan); display: flex; align-items: center;
            justify-content: center; margin: 0 auto 15px auto; box-shadow: 0 0 15px rgba(36, 255, 255, 0.2);
        }
        .avatar-container i { font-size: 2.5rem; color: var(--accent-cyan); }
        .user-email { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }

        /* Bakiye Kutusu */
        .balance-box {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 16px 24px; display: flex;
            justify-content: space-between; align-items: center; margin-bottom: 35px;
        }
        .balance-label { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: #94a3b8; font-weight: 700; letter-spacing: 0.5px; }
        .balance-label i { color: #ffb300; font-size: 1.1rem; }
        .balance-amount-wrapper { font-weight: 800; font-size: 1.2rem; color: var(--accent-cyan); display: flex; gap: 5px; align-items: center; }

        /* Tab Yapısı */
        .tabs-nav { display: flex; border-bottom: 2px solid var(--border-color); margin-bottom: 25px; }
        .tab-link {
            flex: 1; background: transparent; border: none; padding: 15px 0;
            color: var(--text-muted); font-size: 0.9rem; font-weight: 700;
            cursor: pointer; text-align: center; transition: all 0.3s ease; position: relative;
            letter-spacing: 0.5px;
        }
        .tab-link:hover { color: white; }
        .tab-link.active { color: var(--accent-cyan); }
        .tab-link.active::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 100%;
            height: 3px; background-color: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Kart ve Dinamik İçerik CSS Giydirmeleri */
        .user-bet-card {
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 14px; 
            padding: 20px; 
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        
        .bet-details { max-width: 65%; }
        .bet-details h3 { font-size: 1rem; font-weight: 600; margin-bottom: 6px; line-height: 1.4; color: white; }
        .bet-details p { font-size: 0.85rem; color: var(--text-muted); }
        .bet-details b { color: #94a3b8; }

        .bet-stats { display: flex; gap: 20px; align-items: center; text-align: right; }
        .stat-box { display: flex; flex-direction: column; gap: 4px; }
        .stat-box .lbl { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .stat-box .val { font-size: 0.95rem; font-weight: 700; white-space: nowrap; }

        /* Rozetler */
        .badge-choice {
            display: inline-block; padding: 4px 10px; border-radius: 6px; 
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; margin-top: 4px;
        }
        .badge-yes { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
        .badge-no { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge-draw { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }

        /* Sonuç Durumları */
        .result-win { color: #22c55e; font-weight: 700; }
        .result-lose { color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="dashboard.html" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="nav-title">Profilim</div>
        <button class="nav-btn logout-btn" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </nav>

    <main class="profile-container">
        <div class="user-card">
            <div class="avatar-container"><i class="fa-solid fa-user"></i></div>
            <div class="user-email" id="profile-email">Yükleniyor...</div>
        </div>

        <div class="balance-box">
            <div class="balance-label"><i class="fa-solid fa-coins"></i> MEVCUT BAKİYE</div>
            <div class="balance-amount-wrapper">
                <span id="profile-token-balance">Yükleniyor...</span>
                <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Token</span>
            </div>
        </div>

        <div class="tabs-nav">
            <button class="tab-link active" onclick="switchTab(event, 'profile-active-bets')">AKTİF LADESLERİM</button>
            <button class="tab-link" onclick="switchTab(event, 'profile-past-bets')">GEÇMİŞ / ÖZET</button>
        </div>

        <div id="profile-active-bets" class="tab-content active">
            <div style="text-align:center; color:#64748b; padding:30px; font-size:14px;">Yükleniyor...</div>
        </div>

        <div id="profile-past-bets" class="tab-content">
            <div style="text-align:center; color:#64748b; padding:30px; font-size:14px;">Yükleniyor...</div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        // ÖNEMLİ: Dashboard sayfasında yer alan firebaseConfig nesnesini birebir buraya yapıştır!
        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "lades...",
            databaseURL: "https://lades...",
            projectId: "lades...",
            storageBucket: "lades...",
            messagingSenderId: "...",
            appId: "..."
        };

        // Global db nesnesini core.js ve app.js okumadan önce burada yaratıyoruz
        var db;
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
    </script>

    <script src="core.js"></script>
    <script src="app.js"></script>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            // Firebase zaten yukarıda kurulduğu için direkt fonksiyonları ateşleyebiliriz
            if (typeof bootstrapFirebase === "function") {
                bootstrapFirebase();
            }

            setTimeout(() => {
                if (typeof initProfilePage === "function") {
                    initProfilePage();
                }
            }, 200);
        });

        // Tab Değiştirme Fonksiyonu
        function switchTab(event, tabId) {
            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.querySelectorAll(".tab-link").forEach(l => l.classList.remove("active"));
            
            document.getElementById(tabId).classList.add("active");
            event.currentTarget.classList.add("active");
        }

        // Çıkış Yapma Fonksiyonu
        function handleLogout() {
            if (confirm("Çıkış yapmak istediğinize emin misiniz?")) {
                localStorage.removeItem("currentUser");
                window.location.replace("login.html");
            }
        }
    </script>
</body>
</html>
