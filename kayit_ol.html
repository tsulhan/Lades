<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADES | Kayıt Ol</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        :root { --primary: #ff4aa2; --bg: #030814; --card: #0b132b; --text: #ffffff; --subtext: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .card { background: var(--card); padding: 40px; border-radius: 24px; width: 100%; max-width: 420px; border: 1px solid #1c2541; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .header { text-align: center; margin-bottom: 30px; }
        .header h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--subtext); font-size: 14px; }

        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; color: var(--subtext); font-size: 12px; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px 16px; background: #060b19; border: 1px solid #1c2541; border-radius: 12px; color: white; font-size: 15px; transition: all 0.3s; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(255, 74, 162, 0.1); }

        .row { display: flex; gap: 10px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: var(--primary); color: white; margin-top: 10px; box-shadow: 0 4px 15px rgba(255, 74, 162, 0.3); }
        .btn-primary:hover { background: #e03b8d; transform: translateY(-2px); }
        .btn-secondary { background: rgba(36, 255, 255, 0.1); color: #24ffff; border: 1px solid #24ffff; width: auto; white-space: nowrap; }
        .btn-secondary:hover { background: #24ffff; color: #030814; }

        .footer { margin-top: 25px; text-align: center; font-size: 14px; color: var(--subtext); }
        .footer a { color: #24ffff; text-decoration: none; font-weight: 600; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h2>LADES'e Katıl</h2>
            <p>Eğlenceye başlamak için bir adım kaldı</p>
        </div>

        <div class="input-group">
            <label>Davet Kodu</label>
            <div class="row">
                <input type="text" id="reg-code" placeholder="Kodu girin">
                <button class="btn btn-secondary" id="btnCode">İSTE</button>
            </div>
        </div>

        <div class="input-group">
            <label>E-posta</label>
            <input type="email" id="reg-email" placeholder="isim@mail.com">
        </div>

        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="reg-pass" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" id="btnReg">HESABIMI OLUŞTUR</button>

        <div class="footer">
            Zaten hesabın var mı? <a href="login.html">Giriş Yap</a>
        </div>
    </div>

    <script>
        const db = firebase.initializeApp({ databaseURL: "https://lades-f33dd-default-rtdb.firebaseio.com/" }).database();

        document.getElementById('btnCode').addEventListener('click', async () => {
            const email = document.getElementById('reg-email').value;
            if(!email) return alert("Bildirim için önce E-posta adresini girin.");
            await db.ref("adminRequests/" + Date.now()).set({ email, status: "Bekliyor", note: email + " kod istiyor" });
            alert("Talebiniz yöneticiye iletildi!");
        });

        document.getElementById('btnReg').addEventListener('click', async () => {
            const code = document.getElementById('reg-code').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            const snap = await db.ref("invitations").once("value");
            const invites = Object.values(snap.val() || {});
            const valid = invites.find(i => i.code === code && i.status === "Aktif");

            if(!valid) return alert("Geçersiz davet kodu!");

            await db.ref("users/" + email.replace(/\./g, "_")).set({ email, pass, tokens: 3600, role: "user" });
            await db.ref("invitations/" + valid.id).update({ status: "Kullanıldı" });
            
            alert("Kayıt başarılı! Giriş sayfasına yönlendiriliyorsunuz.");
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
