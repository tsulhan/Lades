<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #030814; color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .register-container { background: #0b132b; border: 1px solid #1c2541; padding: 40px; border-radius: 24px; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .logo-icon { font-size: 45px; color: #ff4aa2; text-shadow: 0 0 15px #ff4aa2; margin-bottom: 15px; }
        h2 { font-size: 26px; font-weight: 800; letter-spacing: 1px; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 13px; font-weight: 600; }
        
        /* Davet Kodu Satırı için Flex Yapı */
        .invite-row { display: flex; gap: 10px; }
        .invite-row input { flex: 1; }
        .btn-request-code { background: rgba(36, 255, 255, 0.1); border: 1px solid #24ffff; color: #24ffff; padding: 0 15px; border-radius: 12px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-request-code:hover { background: #24ffff; color: #030814; }

        input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #1c2541; background: #030814; color: white; font-size: 15px; transition: 0.3s; }
        input:focus { border-color: #ff4aa2; outline: none; }
        
        .btn-register { width: 100%; padding: 16px; border-radius: 50px; border: none; background: #ff4aa2; color: white; font-weight: 800; font-size: 16px; cursor: pointer; margin-top: 15px; box-shadow: 0 0 15px #ff4aa2; transition: 0.3s; }
        .btn-register:hover { background: #e03b8d; transform: translateY(-1px); }
        
        .footer-links { margin-top: 25px; font-size: 14px; color: #64748b; }
        .footer-links a { color: #24ffff; text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo-icon">⚡</div>
        <h2>KAYIT OL</h2>
        
        <div class="form-group">
            <label>Davet Kodu</label>
            <div class="invite-row">
                <input type="text" id="reg-invite-code" placeholder="Örn: LADES2026">
                <button type="button" class="btn-request-code" onclick="requestInviteCode()">KOD İSTE</button>
            </div>
        </div>
        
        <div class="form-group">
            <label>E-posta Adresi</label>
            <input type="email" id="reg-email" placeholder="ornek@domain.com">
        </div>
        
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>
        
        <div class="form-group">
            <label>Şifreyi Doğrula</label>
            <input type="password" id="reg-password-confirm" placeholder="••••••••">
        </div>
        
        <button class="btn-register" onclick="handleRegister()">KAYIT OL ⚡</button>
        
        <div class="footer-links">
            Hesabınız var mı? <a href="login.html">Giriş Yapın</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

    <script>
        // Firebase konfigürasyonu ve başlatılması
        const firebaseConfig = {
            databaseURL: "https://lades-app-default-rtdb.firebaseio.com/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        // Veritabanı referansını hem global hem de yerel olarak çakıyoruz
        var db = firebase.database();
        window.db = db;

        // app.js'nin tepede arayıp bulamadığı tüm fonksiyonları İLK BURADA tanımlıyoruz
        window.fbGet = async function(path) {
            const snap = await firebase.database().ref(path).once("value");
            return snap.val();
        };
        var fbGet = window.fbGet;

        window.fbSet = async function(path, data) {
            return firebase.database().ref(path).set(data);
        };
        var fbSet = window.fbSet;

        window.fbRemove = async function(path) {
            return firebase.database().ref(path).remove();
        };
        var fbRemove = window.fbRemove;

        window.objectValuesToArray = function(obj) {
            return obj ? Object.values(obj) : [];
        };
        var objectValuesToArray = window.objectValuesToArray;

        window.uniqueId = function(prefix = "id") {
            return prefix + "_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
        };
        var uniqueId = window.uniqueId;
    </script>

    <script src="src/js/app.js" defer></script>
</body>
</html>
