<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <style>
        body { background: #030814; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #0b132b; padding: 40px; border-radius: 24px; width: 400px; text-align: center; border: 1px solid #1c2541; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; background: #030814; border: 1px solid #1c2541; color: white; }
        button { width: 100%; padding: 15px; border-radius: 50px; border: none; background: #ff4aa2; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>LADES KAYIT</h2>
        <input type="text" id="code" placeholder="Davet Kodu">
        <button id="btnCode">KOD İSTE</button>
        <input type="email" id="email" placeholder="E-posta">
        <input type="password" id="pass" placeholder="Şifre">
        <button id="btnReg">KAYIT OL</button>
    </div>

    <script>
        const app = firebase.initializeApp({ databaseURL: "https://lades-app-default-rtdb.firebaseio.com/" });
        const db = firebase.database();

        // Butonları JavaScript ile dinliyoruz (HTML'deki onclick yerine)
        document.getElementById('btnCode').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            if(!email) { alert("E-posta gir!"); return; }
            
            try {
                await db.ref("adminRequests/" + Date.now()).set({ 
                    email: email, 
                    note: email + " kod istiyor", 
                    status: "Bekliyor" 
                });
                alert("Yöneticiye bildirim gönderildi!");
            } catch(e) { alert("Hata: " + e.message); }
        });

        document.getElementById('btnReg').addEventListener('click', () => {
            alert("Kayıt mantığı burada devreye girecek.");
        });
    </script>
</body>
</html>
