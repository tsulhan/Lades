<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    
    <script src="src/js/firebase.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #020611;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 30%, #0a142c 0%, #020611 70%);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 40px;
            background: #050c1e;
            border: 1px solid #111c35;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .logo-area {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-area span {
            color: #24ffff;
            text-shadow: 0 0 20px rgba(36,255,255,0.4);
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: #475569;
            font-size: 15px;
            transition: color 0.2s;
        }

        .form-group input {
            width: 100%;
            background: #020611;
            border: 1px solid #111c35;
            padding: 14px 16px 14px 46px;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #24ffff;
            box-shadow: 0 0 12px rgba(36,255,255,0.1);
        }

        .form-group input:focus + i {
            color: #24ffff;
        }

        .btn-submit {
            width: 100%;
            background: #24ffff;
            color: #020611;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(36,255,255,0.2);
            transition: all 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(36,255,255,0.35);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }

        .footer-text a {
            color: #24ffff;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        /* Davet kodu isteme butonu stili */
        .btn-request-code {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(36, 255, 255, 0.08);
            border: 1px solid rgba(36, 255, 255, 0.2);
            color: #24ffff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            z-index: 5;
        }

        .btn-request-code:hover {
            background: #24ffff;
            color: #020611;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-area">
            <i class="fa-solid fa-dice"></i> <span>LADES</span>
        </div>
        <div class="subtitle">Yeni bir hesap oluştur ve tahmin havuzuna katıl.</div>

        <div>
            <div class="form-group">
                <label>Davet Kodu</label>
                <div class="input-wrapper">
                    <input type="text" id="reg-invite-code" placeholder="LADES_XXXXXX">
                    <i class="fa-solid fa-ticket"></i>
                </div>
            </div>

            <div class="form-group">
                <label>E-Posta Adresi</label>
                <div class="input-wrapper">
                    <input type="email" id="reg-email" placeholder="ornek@gmail.com">
                    <i class="fa-solid fa-envelope"></i>
                    <button type="button" class="btn-request-code" onclick="requestInviteCode()">Kod İste ✉️</button>
                </div>
            </div>

            <div class="form-group">
                <label>Şifre</label>
                <div class="input-wrapper">
                    <input type="password" id="reg-password" placeholder="••••••••">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Şifre Tekrar</label>
                <div class="input-wrapper">
                    <input type="password" id="reg-password-confirm" placeholder="••••••••">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button class="btn-submit" onclick="handleRegister()">Kayıt Ol ve Başla ⚡</button>
        </div>

        <div class="footer-text">
            Zaten hesabın var mı? <a href="login.html">Giriş Yap</a>
        </div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
