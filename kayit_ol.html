<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'dashboard.html';
        }
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .register-container { background:#0b132b; border:1px solid #1c2541; padding:40px; border-radius:24px; width:100%; max-width:450px; box-shadow:0 10px 30px rgba(0,0,0,0.5); text-align:center; }
        .logo { font-size:32px; font-weight:800; color:#24ffff; text-shadow:0 0 10px #24ffff; margin-bottom:10px; }
        .subtitle { color:#64748b; font-size:14px; margin-bottom:25px; }
        .form-group { text-align:left; margin-bottom:15px; }
        .form-group label { display:block; margin-bottom:6px; color:#94a3b8; font-size:13px; font-weight:600; }
        .form-group input { width:100%; padding:12px; border-radius:12px; border:1px solid #1c2541; background:#030814; color:white; font-size:15px; }
        .btn-register { width:100%; padding:15px; border-radius:50px; border:none; background:#24ffff; color:#030814; font-weight:800; font-size:16px; cursor:pointer; box-shadow:0 0 15px rgba(36, 255, 255, 0.3); transition:0.3s; margin-top:15px; }
        .footer-link { margin-top:20px; font-size:13px; color:#64748b; }
        .footer-link a { color:#ff4aa2; text-decoration:none; font-weight:600; }
        .request-link { display:block; margin-top:10px; color:#64748b; font-size:12px; text-decoration:underline; cursor:pointer; }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="logo">⚡ LADES</div>
        <div class="subtitle">Aramıza katılmak için davet kodunu girin</div>
        
        <div class="form-group">
            <label>Davet Kodu</label>
            <input type="text" id="reg-invite-code" placeholder="LADES2026">
        </div>

        <div class="form-group">
            <label>E-posta Adresi</label>
            <input type="email" id="reg-email" placeholder="isim@lades.com">
        </div>
        
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>

        <div class="form-group">
            <label>Şifre Tekrar</label>
            <input type="password" id="reg-password-confirm" placeholder="••••••••">
        </div>
        
        <button class="btn-register" onclick="handleRegister()">KAYIT OL 🚀</button>
        <span class="request-link" onclick="requestInviteCode()">Davet kodum yok, talep et</span>
        
        <div class="footer-link">
            Zaten üye misiniz? <a href="index.html">Giriş Yap</a>
        </div>
    </div>

    <script src="src/js/app.js"></script>
</body>
</html>
