<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - LADES</title>
    <style>
        body { background: #030814; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #0b132b; padding: 40px; border-radius: 24px; width: 400px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; background: #030814; border: 1px solid #1c2541; color: white; }
        button { width: 100%; padding: 15px; border-radius: 50px; border: none; background: #ff4aa2; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>KAYIT OL</h2>
        <input type="text" id="reg-invite-code" placeholder="Davet Kodu">
        <button onclick="debugRequestCode()">KOD İSTE (TEST)</button>
        <input type="email" id="reg-email" placeholder="E-posta">
        <input type="password" id="reg-password" placeholder="Şifre">
        <button onclick="debugRegister()">KAYIT OL (TEST)</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { databaseURL: "https://lades-app-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // TEST FONKSİYONU 1
        async function debugRequestCode() {
            const email = document.getElementById("reg-email").value;
            if(!email) { alert("E-posta boş!"); return; }
            try {
                await db.ref("adminRequests/" + Date.now()).set({ email: email, status: "Bekliyor" });
                alert("İstek gönderildi!");
            } catch(e) { alert("Hata: " + e.message); }
        }

        // TEST FONKSİYONU 2
        async function debugRegister() {
            alert("Kayıt fonksiyonu tetiklendi, Firebase bekleniyor...");
            // Buraya senin app.js içindeki asıl kayıt mantığını ekleyeceğiz.
        }
    </script>
</body>
</html>
