<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - LADES</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        body { background:#030814; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .auth-container { width:100%; max-width:350px; text-align:center; }
        
        /* Logo Stili */
        .logo-bolt { font-size:60px; color:#ff4aa2; margin-bottom:15px; text-shadow:0 0 20px #ff4aa2; }
        
        h2 { margin-bottom:25px; letter-spacing:1px; }
        
        /* Input Stili */
        input { width:100%; padding:18px; margin:8px 0; border-radius:12px; border:1px solid #333; background:#111; color:white; font-size:16px; }
        input::placeholder { color:#555; }
        
        /* Davet Kodu Kutusu (Farklı görünmesi için hafifçe belirginleştirebiliriz) */
        #invite-code { border:1px solid #ff4aa2; box-shadow:0 0 10px rgba(255,74,162,0.2); }
        
        .btn-register { width:100%; padding:20px; border-radius:50px; border:none; background:#ff4aa2; color:white; font-weight:800; font-size:18px; cursor:pointer; margin-top:20px; box-shadow:0 0 15px #ff4aa2; }
        .back-link { color:#888; margin-top:25px; display:block; text-decoration:none; font-size:14px; }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-bolt">⚡</div>
    
    <h2>KAYIT OL</h2>
    
    <input type="text" id="invite-code" placeholder="Davet Kodu">
    <input type="email" id="email" placeholder="E-posta Adresi">
    <input type="password" id="password" placeholder="Şifre">
    <input type="password" id="confirm-password" placeholder="Şifreyi Doğrula">
    
    <button class="btn-register">KAYIT OL</button>
    
    <a href="login.html" class="back-link">← Giriş Sayfasına Dön</a>
</div>

</body>
</html>
