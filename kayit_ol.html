<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LADES | Kayıt Ol</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase ve Lades dosyalarını ekleyelim -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="src/js/firebase.js"></script>
    <script src="src/js/core.js"></script>
    
    <style>
        :root { 
            --primary: #ff4aa2; 
            --bg: #030814; 
            --card: #0b132b; 
            --text: #ffffff; 
            --subtext: #94a3b8; 
            --border: #1c2541;
            --input-bg: #060b19;
            --cyan: #24ffff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .card { background: var(--card); padding: 40px; border-radius: 24px; width: 100%; max-width: 440px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--cyan)); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .logo-icon { font-size: 40px; margin-bottom: 10px; text-shadow: 0 0 15px var(--primary); display: inline-block; animation: pulse 2s infinite; }
        .header h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(to right, #ffffff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--subtext); font-size: 14px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; color: var(--subtext); font-size: 12px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.7px; }
        
        .row { display: flex; gap: 10px; }
        input { width: 100%; padding: 15px 16px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: white; font-size: 15px; transition: all 0.3s ease; }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(255, 74, 162, 0.15); }

        .btn { padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: all 0.2s ease; font-size: 14px; }
        .btn-primary { width: 100%; background: var(--primary); color: white; margin-top: 10px; box-shadow: 0 4px 20px rgba(255, 74, 162, 0.3); font-size: 15px; letter-spacing: 0.5px; }
        .btn-primary:hover { background: #e03b8d; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(255, 74, 162, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        
        .btn-secondary { background: rgba(36, 255, 255, 0.08); color: var(--cyan); border: 1px solid var(--cyan); white-space: nowrap; padding: 0 20px; }
        .btn-secondary:hover { background: var(--cyan); color: #030814; box-shadow: 0 0 15px rgba(36, 255, 255, 0.4); }

        .footer { margin-top: 30px; text-align: center; font-size: 14px; color: var(--subtext); border-top: 1px solid rgba(28, 37, 65, 0.5); padding-top: 20px; }
        .footer a { color: var(--cyan); text-decoration: none; font-weight: 600; transition: color 0.2s; }
        .footer a:hover { text-decoration: underline; color: #fff; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="logo-icon">⚡</div>
            <h2>LADES'e Katıl</h2>
            <p>Eğlence dolu rekabete adım atın</p>
        </div>

        <div class="input-group">
            <label>Davet Kodu</label>
            <div class="row">
                <input type="text" id="reg-invite-code" placeholder="Davet kodunuzu girin">
                <button class="btn btn-secondary" id="btnRequestCode">KOD İSTE</button>
            </div>
        </div>

        <div class="input-group">
            <label>E-posta Adresi</label>
            <input type="email" id="reg-email" placeholder="ornek@domain.com">
        </div>

        <div class="input-group">
            <label>Şifre</label>
            <input type="password" id="reg-password" placeholder="••••••••">
        </div>

        <div class="input-group">
            <label>Şifre Tekrar</label>
            <input type="password" id="reg-password-confirm" placeholder="••••••••">
        </div>

        <button class="btn btn-primary" id="btnRegister">HESABIMI OLUŞTUR 🚀</button>

        <div class="footer">
            Zaten bir hesabın var mı? <a href="login.html">Giriş Yap</a>
        </div>
    </div>

    <script>
        // Kayıt sayfasına özel JavaScript
        document.addEventListener("DOMContentLoaded", function() {
            // KOD İSTE Butonu
            document.getElementById('btnRequestCode').addEventListener('click', requestInviteCode);
            
            // KAYIT OL Butonu
            document.getElementById('btnRegister').addEventListener('click', handleRegister);
        });

        // KOD İSTE fonksiyonu - app.js'deki ile aynı olacak
        async function requestInviteCode() {
            const email = document.getElementById('reg-email').value.trim();

            if (!email) {
                alert("Lütfen önce E-posta alanını doldurun!");
                return;
            }

            if (typeof db === "undefined" || !db) {
                alert("Firebase bağlantısı yok. Lütfen sayfayı yenileyin.");
                return;
            }

            try {
                // adminRequests düğümüne kaydedelim
                const reqKey = uniqueId("req");
                await fbSet(`adminRequests/${reqKey}`, {
                    id: reqKey,
                    type: "invite",
                    email: email,
                    status: "Bekliyor",
                    createdAt: Date.now()
                });

                alert("✅ Davet kodu talebiniz yöneticiye iletildi! Yönetici onayladığında kodunuz hazır olacak.");
            } catch (error) {
                console.error("Talep gönderme hatası:", error);
                alert("❌ Talep gönderilirken bir hata oluştu: " + error.message);
            }
        }

        // KAYIT OL fonksiyonu
        async function handleRegister() {
            const inviteCode = document.getElementById('reg-invite-code').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password-confirm').value;

            // Tüm alanların dolu olduğunu kontrol et
            if (!inviteCode || !email || !password || !passwordConfirm) {
                alert("Lütfen tüm alanları doldurun!");
                return;
            }

            // Şifre eşleşmesini kontrol et
            if (password !== passwordConfirm) {
                alert("Şifreler birbiriyle uyuşmuyor!");
                return;
            }

            // Şifre uzunluğunu kontrol et
            if (password.length < 4) {
                alert("Şifre en az 4 karakter olmalıdır!");
                return;
            }

            if (typeof db === "undefined" || !db) {
                alert("Firebase bağlantısı yok. Lütfen sayfayı yenileyin.");
                return;
            }

            try {
                // 1. Davet kodunu kontrol et (inviteCodes düğümünde ara)
                const inviteCodesSnap = await fbGet("inviteCodes");
                const inviteCodes = inviteCodesSnap || {};
                
                // Kodun geçerli olup olmadığını kontrol et
                let foundKey = null;
                let foundCode = null;
                
                Object.keys(inviteCodes).forEach(key => {
                    if (inviteCodes[key] === inviteCode) {
                        foundKey = key;
                        foundCode = inviteCodes[key];
                    }
                });

                if (!foundKey) {
                    alert("❌ Geçersiz davet kodu! Lütfen doğru kodu girdiğinizden emin olun.");
                    return;
                }

                // 2. Kullanıcının zaten kayıtlı olup olmadığını kontrol et
                const usersSnap = await fbGet("ladesUsers");
                const users = usersSnap || {};
                const userKey = email.replace(/\./g, ',');
                
                if (users[userKey]) {
                    alert("❌ Bu e-posta adresi zaten kayıtlı! Lütfen giriş yapın.");
                    return;
                }

                // 3. Yeni kullanıcıyı oluştur
                await fbSet(`ladesUsers/${userKey}`, {
                    email: email,
                    password: password, // Not: İleride hash'lenecek
                    balance: 0,
                    isAdmin: false,
                    createdAt: Date.now()
                });

                // 4. Kullanılan davet kodunu sil (tek kullanımlık yap)
                await fbRemove(`inviteCodes/${foundKey}`);

                alert("✅ Kayıt başarılı! Başlangıç bakiyeniz: 0 TOKEN. Token talebi oluşturabilirsiniz.");
                
                // 5. Giriş sayfasına yönlendir
                window.location.href = "login.html";

            } catch (error) {
                console.error("Kayıt hatası:", error);
                alert("❌ Kayıt sırasında bir hata oluştu: " + error.message);
            }
        }
    </script>
</body>
</html>
